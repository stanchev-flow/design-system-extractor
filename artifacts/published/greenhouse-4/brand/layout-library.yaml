schemaVersion: layout-patterns.v1
lane: greenhouse-4
patterns:
- id: hero
  origin: extracted
  useCase: hero
  archetypeRef: centered-copy-with-floating-media
  surfaceIntent: surface/hero
  confidence: high
  provenance:
  - home-section-00
  description: Centered serif display and sans intro copy stacked over a mint canvas, with
    a primary filled action paired with an underlined text-link action; freeform portrait
    photos and floating product-UI chips orbit the copy connected by thin curved leader lines.
  layout:
    structure: centered copy stack with scattered orbiting media cluster
    alignment: center
    containerWidth: full-bleed
    approxPaddingPx:
      top: 84
      bottom: 96
    gapPx: 32
  responsive:
    base: centered stack, media chips orbit around copy
    narrow: copy stack retained, orbiting chips collapse or hide
  contentShape:
    slots:
    - name: heading
      role: primary-heading
      type: content
      sizeClass: hero
      textLen: short
      copyBinding: layoutCopy.hero.heading
      geometry:
        approxSizePx: 92
        weightApprox: 500
        case: sentence
        align: center
    - name: body
      role: intro-body
      type: content
      sizeClass: body
      textLen: medium
      copyBinding: layoutCopy.hero.body
      geometry:
        approxSizePx: 21
        weightApprox: 400
        align: center
        headingToBodyPx: 44
    - name: primaryAction
      role: primary-action
      type: action
      sizeClass: control
      textLen: word
      copyBinding: layoutCopy.hero.cta
      width: hug
      geometry:
        paddingPx: 18 44
        radiusPx: 28
        bodyToCtaPx: 60
    - name: ghostAction
      role: secondary-action
      type: action
      sizeClass: control
      textLen: short
      copyBinding: layoutCopy.hero.ghost
      width: hug
      geometry:
        style: text-underline
    - name: mediaCluster
      role: decorative-media-cluster
      type: media
      mediaAspect: freeform
      z: front
      copyBinding: none
      geometry:
        approxFractionOfSection: 0.2
        shadow: 0 8px 24px rgba(0,0,0,.10)
      assets:
      - 030-689610cd7418c453485571fd-home-hero-m-clusters-of-three-solutions-workflows-with-photos-of-ui-and-people-working-402x.png
    assets: []
    bandPadding:
      top: 5.25rem
      bottom: 6rem
    bandRhythm:
      headingToBody: 2.75rem
      bodyToCta: 3.75rem
  specialTreatments:
  - kind: scattered-cluster
    note: portrait photos and product-UI chips orbit the copy with curved connector lines
  - kind: ghost-word
    target: heading
    note: '''only'' rendered in italic serif within the heading'
  sourcePages:
  - home
- id: featureGrid
  origin: extracted
  useCase: features
  archetypeRef: three-column-media-top-cards
  surfaceIntent: surface/primary
  confidence: high
  provenance:
  - home-section-03
  description: Full-width serif display heading over a three-column card row; each card is
    a rounded landscape photo media-well, serif subheading, sans body and an underlined text-link
    action.
  layout:
    structure: heading full-width top then 3-column card row
    alignment: left
    columns: 3
    containerWidth: contained
    approxPaddingPx:
      top: 40
      bottom: 80
    gapPx: 40
  responsive:
    base: 3 columns
    narrow: single column stack, cards full width
  contentShape:
    slots:
    - name: heading
      type: content
      role: section-heading
    - name: itemMedia
      type: image
      role: card-media-well
      assets:
      - 048-66ce09f23bfc5382e0a79e3a-content-gallery-1.webp
      - 049-66ce09efcca27fafac5199b7-content-gallery-2.webp
      - 050-66ce09ec544c15c6fafaf9aa-content-gallery-3.webp
    - name: items
      type: content
      role: feature-card-list (media-well -> heading -> body -> action)
    assets: []
    bandPadding:
      top: 2.5rem
      bottom: 5rem
    bandRhythm:
      headingToBody: 1.25rem
      bodyToCta: 1.75rem
    deviceGeometry:
      columnGap: 2.5rem
  specialTreatments:
  - kind: media-top-card
    note: each card leads with a rounded landscape photograph media-well
  sourcePages:
  - home
- id: logoWall
  origin: extracted
  useCase: logos
  archetypeRef: split-copy-plus-logo-grid
  surfaceIntent: surface/primary
  confidence: high
  provenance:
  - home-section-02
  description: 'Split ~50/50 layout: serif heading and a primary filled action on the left,
    a 2x3 monochrome customer-logo grid on the right, divided by a hairline vertical rule.'
  layout:
    structure: split copy left / 2x3 logo grid right with vertical rule
    alignment: left
    columns: 2
    containerWidth: contained
    approxPaddingPx:
      top: 140
      bottom: 120
    gapPx: 150
  responsive:
    base: split two-column
    narrow: copy stacks above logo grid, grid reflows to 3x2 or 2-wide
  contentShape:
    slots:
    - name: heading
      role: section-heading
      type: content
      sizeClass: display
      textLen: short
      copyBinding: layoutCopy.logoWall.heading
      geometry:
        approxSizePx: 46
        weightApprox: 400
        case: sentence
        align: left
    - name: primaryAction
      role: primary-action
      type: action
      sizeClass: control
      textLen: short
      copyBinding: layoutCopy.logoWall.cta
      width: hug
      geometry:
        paddingPx: 16 32
        radiusPx: 28
        headingToCtaPx: 46
    - name: logoGrid
      role: logo-grid
      type: logo
      mediaAspect: landscape
      z: back
      copyBinding: sectionCopy.logosLegible
      geometry:
        columns: 3
        rows: 2
        countObserved: 6
        approxFractionOfSection: 0.4
      assets:
      - 042-684b22ea4479a38eba02bb7a-nfl-240x74-20-1.png
      - 043-66db2afc7f4ffa8dac7d63af-coursera-2024-02-22-193551-bfgg.avif
      - 044-684b1591b49b84db80e1e68b-logo-anthropic.png
      - 045-684b154b7f3a0b8ea13a87db-logo-datavant.png
      - 046-6849817eafb5f7300bca18d3-revlon.png
      - 047-66db2b583c8c62fd585f04a3-seatgeek-2024-02-22-193550-wvza.avif
    assets: []
    bandPadding:
      top: 8.75rem
      bottom: 7.5rem
  specialTreatments:
  - kind: vertical-rule
    note: ~1px light grey-green rule separates copy column from logo grid
  sourcePages:
  - home
- id: stats
