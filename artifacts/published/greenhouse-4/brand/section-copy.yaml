      body: MyGreenhouse is a powerful new candidate portal that transforms hiring from robotic
        to remarkable. It keeps candidates informed with real-time updates, surfaces new opportunities
        and makes applying seamless – while giving recruiters the insights to quickly identify
        top talent.
      meta: Create a Job Alert
