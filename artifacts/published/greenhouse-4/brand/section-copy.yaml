    heading: Why the top companies choose Greenhouse
    items:
    - heading: Hiring the right people for the role, every time
      body: Stronger candidate pools; Reputation for excellent candidate experience; Fair
        and confident hiring decisions based on objective criteria; Fill roles efficiently,
        predictably and consistently; Increased accountability and stakeholder buy-in; Recruiting
        teams empowered to be strategic advisors
    - heading: Navigating market changes in hiring with confidence
      body: Less exposure to costly legal risks and compliance issues; Solutions that help
        you execute business plans with confidence; Less money spent on third-party consultants
