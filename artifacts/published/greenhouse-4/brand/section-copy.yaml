  features:
    heading: Your one-and-done hiring platform
    body: 'What makes businesses thrive or fail? The people working there day to day. That''s
      why companies spend so much time and money on hiring.


      With Greenhouse, you won''t need to gamble that time and money on new solutions as technology
      evolves. For 10+ years, we''ve been the industry leader in solving the challenges companies
      face in making high-quality hires – in one scalable platform.'
