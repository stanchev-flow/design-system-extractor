signatures:
- id: serif-mint-hero
  description: Editorial serif display in deep green over a pale mint canvas with orbiting
    product-UI chips.
- id: green-blue-pill-duo
  description: Rounded pill actions split between a primary green (#008561) and a blue demo-request
    accent (#3574d6).
- id: dark-green-bookend
  description: Pages close on a full-bleed dark green (#15372c) CTA band and footer with a
    lowercase sprout 'g' wordmark.
voice:
  ref: voice-facts.yaml
  dials:
    value:
      variance: low
      motion: restrained
      density: medium
    confidence: high
    source: creation
    scope: design-language
  motionSpec:
    durations:
      fast: 150ms
      base: 300ms
      slow: 500ms
    easing:
      primary: cubic-bezier(0.645, 0.045, 0.355, 1)
    reducedMotion: declared
    source: motion-audit
    confidence: high
    note: durations from transitionCensus (all .15s dominant; .3s cubic-bezier color/border
      tweens); easing from the source's dominant cubic-bezier
motion:
  value:
    defaultTransition: all 0.15s
    primaryButtonTransition: all 0.2s
    signatureEasing: cubic-bezier(0.645, 0.045, 0.355, 1)
    notes: Buttons animate all properties in 150ms; the primary family uses 200ms; accordions
      and background washes use longer 0.3s-1.2s eases. Nav link underline uses a scale transform
      on hover.
    confidence: high
    source: creation
    scope: design-language
