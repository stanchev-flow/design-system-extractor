version: '2.0'
meta:
  canonicalTier:
    viewport: 1440
    label: desktop
    note: All canonical type/spacing values measured at the 1440px capture tier; ladders trace
      to the 1920/1440/960/375 sample set.
brand:
  name: Greenhouse
  legalName: Greenhouse Software, Inc.
  sourceUrl: https://www.greenhouse.com
  snapshot:
    value: Greenhouse is a hiring platform whose marketing site presents itself as an end-to-end,
      AI-powered recruiting solution spanning sourcing to onboarding, anchored by the serif
      display line 'The only hiring platform you'll ever need' set in a deep forest green
      (#15372c) on a mint canvas (#cdeadf). The visual system pairs the Untitled Serif family
      for editorial headings with Untitled Sans for body and controls, uses rounded pill buttons
      in a primary green (#008561) and a blue demo-request accent (#3574d6), and closes pages
      on a dark green footer band with a 'Modern Recruiter newsletter' signup and a lowercase
      sprout 'g' wordmark.
    confidence: high
    source: creation
    scope: design-language
