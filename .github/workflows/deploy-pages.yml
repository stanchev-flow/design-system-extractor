name: Deploy published bundle to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Stage bundle
        run: |
          mkdir -p _site
          cp -R artifacts/published/. _site/

      # artifacts/published/ is generated output that the export script rewrites on
      # every run, so the noindex signals are applied to the staged copy only.
      - name: Discourage indexing
        run: |
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          python3 - <<'PY'
          import pathlib
          import re

          META = '<meta name="robots" content="noindex, nofollow">'
          head_open = re.compile(r"<head\b[^>]*>", re.IGNORECASE)

          injected, already, no_head = [], [], []
          for path in sorted(pathlib.Path("_site").rglob("*.html")):
              text = path.read_text(encoding="utf-8")
              if 'name="robots"' in text:
                  already.append(path)
                  continue
              match = head_open.search(text)
              if match is None:
                  no_head.append(path)
                  continue
              cut = match.end()
              path.write_text(text[:cut] + META + text[cut:], encoding="utf-8")
              injected.append(path)

          print(f"noindex injected: {len(injected)}, already tagged: {len(already)}")
          for path in no_head:
              # robots.txt still covers these; surface them so the export can be fixed.
              print(f"::warning file={path}::no <head> found, noindex meta not injected")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
