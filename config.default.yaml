# Screenshot to Template - Default Configuration
# Override any of these in your own config file passed via --config
#
# This file is the CLI baseline: it is always loaded first, then a --config file
# is merged over it. `config-anthropic.yaml` is the Studio's base config and
# intentionally differs from this file (notably framework-generation-enabled),
# so the two are not expected to match. See docs/getting-started.md.

provider: openai
model: gpt-5.5
reasoning-effort: high
site-asset-generation-enabled: true
# Framework generation (opt-in): React + Tailwind token skin. Off by default —
# brand compose (token CSS + static HTML) is the canonical product path.
# When enabled, do NOT use shadcn-as-shipped skin; prefer headless behavior + owned tokens.
# Pinned false by brand_pipeline/tests/test_brand_signal_composition.py. The
# Studio opts in via config-anthropic.yaml; the CLI opts in per-run with
# --framework-sites. Note that AppConfig's dataclass default is True, which only
# applies when a config is constructed without load_config().
framework-generation-enabled: false
# Framework generation is FAIL-CLOSED: it refuses to run for a brand lane that
# has not cleared the ordered gates (G1 extraction → G2 validation → G3 harness →
# G4 replica >= bar). Set this to true ONLY to knowingly generate from a failing
# lane; the refusal is then logged and recorded in framework-report.json instead
# of blocking. Equivalent env var: FRAMEWORK_GENERATION_ALLOW_UNGATED=1.
framework-generation-allow-ungated: false
# Vanilla one-shot HTML (site-claude.html / site-gpt55.html). Off by default; use --vanilla-sites to enable.
vanilla-site-generation-enabled: false
site-asset-image-model: gpt-image-2
site-asset-generation-workers: 3
surface-map-mode: auto
run-reviews: false
section-detection-provider: openai
section-detection-model: gpt-5.5
section-detection-reasoning-effort: high

max-image-dimension: 2048
auto-chunk-tall-section-detection: true
auto-two-chunk-threshold-height: 22000
auto-three-chunk-threshold-height: 999999
auto-chunk-overlap: 1600
use-local-inventory-per-chunk: false
chunked-section-detection: false
section-detection-chunk-height: 2400
section-detection-chunk-overlap: 400
section-detection-chunk-trigger-height: 3200
chunk-ruler-major-step: 50
chunk-ruler-minor-step: 25
chunk-boundary-cluster-tolerance: 90
max-tokens: 4096

# Override the system prompt to change output structure:
# system-prompt: |
#   Your custom prompt here...

# Override the structural analysis prompt (used in both modes before synthesis):
# structural-analysis-prompt: |
#   Your custom prompt here...

# Override the merge prompt (used in sectioned mode):
# merge-prompt: |
#   Your custom merge prompt here...
