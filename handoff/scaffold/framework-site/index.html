<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Neutral scaffold default. scaffold_framework_project() stamps the brand's
         own title here per run; this placeholder must never read as a real brand. -->
    <title>Design system scaffold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- SCAFFOLD DEFAULT webfont, not brand-derived: the framework lane does not yet
         resolve this link from the brand's measured @font-face, so a generated app
         can load a typeface its brand does not use. Fix belongs in the lane's
         webfont handling, not here. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
