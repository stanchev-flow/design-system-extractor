<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Neutral scaffold default. scaffold_framework_project() stamps the brand's
         own title here per run; this placeholder must never read as a real brand. -->
    <title>Design system scaffold</title>
    <!-- brand-webfont:start -->
    <!-- No webfont by default. scaffold_framework_project() replaces this region with
         the link the ACTIVE brand's own type facts resolve to, and leaves it empty
         when the brand delivers its faces some other way or delivers none. A
         hardcoded link here would let a generated app load a typeface its brand does
         not use, which reads as correct and is not. -->
    <!-- brand-webfont:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
