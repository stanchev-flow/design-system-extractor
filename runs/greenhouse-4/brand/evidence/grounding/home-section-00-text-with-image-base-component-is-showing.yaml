mediaComposition:
- mode: scattered-cluster
  layers: mint canvas -> centered serif copy stack -> orbiting portrait photos + product-UI cards + mint
    pill labels connected by thin curved connector lines; each photo/card/pill is a SEPARATE element
  bakedVsSeparable: copy, photos, product cards, and pill labels are separable layers; connector lines
    link chips to photos
  componentsOverMedia: product-UI cards, status badges, and chat toast float over/beside media
generatedVisualDevices:
- kind: css-gradient
  evidence: faint soft radial lightening of mint canvas behind copy, no raster grain
  params: 'mint #cdeadf base, subtle lighter center'
  poster: flat pale-mint field with slight center glow
chrome:
  casing: title
  separators: whitespace-only
  iconShape: none
  surfaceApprox: '#ffffff'
  linkTreatment: '~17px #1f2a26 title-case nav links, evenly spaced'
  ctaTreatment: outlined white 'Sign In' pill + blue filled 'Request a demo' pill, both hugging content;
    trailing search glyph
motionHints:
- curved connector lines linking floating chips to photos (assembled/animated reveal affordance)
- arrow/icon glyphs inside mint pills (label chips)
- chat toast bottom-right suggests live embedded widget
confidence: high
notes:
- '''only'' rendered in italic serif within the heading'
- bottom dark-green band is truncated at crop edge (start of next section)
- floating circular 'g' chat launcher at bottom-right corner
- Request a demo appears twice (navbar filled pill + hero underlined text link)
