    meta: Read Inizio’s customer story
  actions:
  - label: Read MLB’s customer story
    styleHint: text-underline
  - label: 'IDC 2024: The business value of Greenhouse'
    styleHint: text-underline
  - label: Read Inizio’s customer story
    styleHint: text-underline
