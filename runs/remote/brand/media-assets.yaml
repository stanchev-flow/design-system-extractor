             alpha: true, stats: null, focalPoint: null, safeCrop: null,
             altHarvested: "Remote Wordmark" }
    usageRights: own
    treatmentDefaults: null
    compositionRoles: [nav-wordmark, footer-wordmark]
    provenance: { source: capture-files, sections: [navbar, footer], confidence: high }

