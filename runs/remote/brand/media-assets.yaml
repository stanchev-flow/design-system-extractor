schemaVersion: media-assets.v1
brand: Remote
source: >-
  Authored 2026-07-16 (media semantics) FROM EXISTING EVIDENCE ONLY: the Phase-D
  2026-07-07 capture's curated assets (assets-tagged.json, 58 files), the fid8
  disclosure-state captures (per-item collages), evidence/grounding/*.yaml,
  section-rects.json + the fullpage capture (poster crop), and Pillow-measured
  per-file stats. No re-extraction.
note: >-
  assets-tagged.json remains the renderer-compat inventory (attach_asset_inventory
  reads it; its mediaTreatmentRules stay the role-scoped fallback). This artifact is
  the richer semantic SUPERSET: stable logical-asset ids, VARIANT DEDUPE
  (content-hash-proven duplicate files collapse into one logical asset), the closed
  kind taxonomy, usage rights (AS-67), measured luminance/busyness stats, and the
  brand's generated-visual recipe. treatmentDefaults.fit mirrors the fit each
  file's actual current usage resolves through the tagged rules, so rendering is
  unchanged. Chrome-only nav-icon-*/nav-card-*/logo-inline-* files stay
  unregistered except where they are byte-identical twins of registered assets
  (recorded as variants).

# ── brand-level imagery grammar (spec §4). Remote's page photography is limited to
# the four testimonial portraits (avatars); everything else is illustration,
# product-UI collage, or art surface. Measured over the four portrait files: cool
# blue-teal environmental cast (hues 219-220), mid-key, vivid but controlled color.
photographyFingerprint:
  measured:
    temperatureCast: cool
    keyExposure: mid-key
    saturationBand: vivid
    finish: neutral
    sampleSize: 4
    source: measured
  prose: >-
    People photography appears only as testimonial portraits: color environmental
    headshots on cool blue-teal backdrops, mid-key, clean neutral finish, cropped
    to circles at render. The brand's visual mass otherwise comes from pastel
    noise-gradient art surfaces, flat product illustration, and product-UI
    collages on deep-navy plates — new photo briefs should stay in the cool,
    saturated-but-clean portrait family and never introduce warm lifestyle scenes.

