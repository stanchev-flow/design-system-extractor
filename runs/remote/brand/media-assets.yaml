# ── generated-visual devices (code recipes, not files — spec §5) ────────────────────
generatedVisuals:
  - id: panel-edge-soft-glow
    kind: css-gradient
    recipe:
      shape: radial
      position: "50% 100%"
      stops: ["accent/positive-soft 0%", "transparent 70%"]
      tokenRoles: [accent/positive-soft]
      evidence: >-
        Soft green radial glow at the inline conversion panel's lower edge
        (grounding section-04: gradient #e6e8e7 -> #8fd6a8; the panel treatment's
        "soft green radial glow at lower edge" fact). The glow is authored CSS on
        the source, not a raster: the noise-art files carry no green cast at that
        edge and the wash re-instantiates at any panel width.
    poster: generated/gv-soft-glow-edge-poster.png
    degrade: [live, poster, omit]
    provenance: { source: capture-files, sections: [banner-cta], confidence: high }
