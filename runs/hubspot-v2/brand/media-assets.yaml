schemaVersion: media-assets.v1
brand: HubSpot v2
source: >-
  Authored 2026-07-16 (media semantics) FROM EXISTING EVIDENCE ONLY: the 2026-07-10
  capture's curated assets (assets-tagged.json, 66 files), evidence/grounding/*.yaml,
  css-rules.json (band gradients), section-rects.json + the fullpage capture
  (poster crops, pixel samples), and Pillow-measured per-file stats. No re-extraction.
note: >-
  assets-tagged.json remains the renderer-compat inventory (attach_asset_inventory
  reads it; its mediaTreatmentRules stay the role-scoped fallback). This artifact is
  the richer semantic SUPERSET: stable logical-asset ids, the closed kind taxonomy,
  usage rights (AS-67), measured luminance/busyness stats, and the brand's
  generated-visual recipes. treatmentDefaults.fit mirrors the fit each file's actual
  current usage resolves through the tagged rules, so rendering is unchanged.
  logo-inline-*.svg (uncurated inline-SVG harvest duplicates, tagged nowhere and
  bound nowhere) are deliberately unregistered.

# ── brand-level imagery grammar (spec §4) — measured via Pillow over the four real
# photographs (018 hero + 045/046/047 case studies): dominant hues 24/33/5/49
# (warm band), mid-key exposure, moderate saturation, no gloss/specular treatment.
photographyFingerprint:
  measured:
    temperatureCast: warm
    keyExposure: mid-key
    saturationBand: moderate
    finish: matte
    sampleSize: 4
    source: measured
  prose: >-
    Warm, people-forward workplace photography: real teams in real interiors, warm
    cast (amber/orange dominant hues), mid-key exposure, moderate saturation, matte
    finish. The hero deploys the family full-bleed under a measured flat dark scrim
    (rgba(0,0,0,0.4)); proof contexts deploy it as rounded-corner card media. New
    photography briefs should stay in this family — candid environments over studio
    setups, warm light over cool, matte over glossy.

