version: '2.0'
brand:
  name: Greenhouse
  sourceUrl: https://www.greenhouse.com/
  snapshot:
    value: Greenhouse is a hiring platform whose marketing site pairs a warm sage-green canvas with a
      deep forest-green ink (#15372c) and a confident emerald accent (#008561), using the Untitled Serif
      family for large editorial display and headings and Untitled Sans for body, navigation and controls.
      Its interface language is built from fully rounded pill buttons (24-25px radius) in green, blue
      and outline variants, generous section padding, floating white product-UI cards over tinted panels,
      and dark forest-green bookend bands for CTA and footer regions.
