  - light canvas sections alternate with dark forest-green bookend bands (CTA, footer)
  - tinted mint and grey panels nest inside the light canvas for feature and comparison modules
  nesting:
  - white product-UI cards and media-wells float over both tint and canvas surfaces
  confidence: high
  source: creation
  scope: design-language
typography:
  value:
    displayFamily: Untitled Serif, Georgia, sans-serif
    textFamily: Untitled Sans, Arial, sans-serif
    headingWeight: 400
    emphasisWeight: 500
    principle: Large serif display and headings paired with humanist grotesque sans for body, navigation
      and controls; headings run sentence case with tight negative tracking.
  confidence: high
  source: creation
  scope: design-language
spacing:
  value:
    rhythm: Generous vertical rhythm — contained feature sections ~130px, dark CTA bands ~200px, footer
      ~120px top padding.
    columnGap: 3.75rem
  confidence: high
  source: creation
  scope: design-language
surfaces:
  value:
    canvas: surface/primary
    bookend: surface/inverse
