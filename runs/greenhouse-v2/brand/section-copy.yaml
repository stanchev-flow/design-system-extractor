    items:
    - heading: Greenhouse AI
      body: Hiring needs more than faster automation. It needs to be completely reimagined. Explore the
        next wave of AI capabilities from Greenhouse, built to help teams cut through noise, strengthen
        signal and make structured hiring easier to execute – without losing human judgment.
      cta: See AI features
    - heading: Real Talent
      body: Greenhouse Real Talent™ brings triple layers of trust to hiring with candidate fraud detection,
