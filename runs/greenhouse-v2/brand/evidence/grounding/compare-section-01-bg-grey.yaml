copy:
  eyebrow: null
  heading: Your one-and-done hiring platform
  subheading: null
  body: 'What makes businesses thrive or fail? The people working there day to day.
    That’s why companies spend so much time and money on hiring.


    With Greenhouse, you won’t need to gamble that time and money on new solutions
    as technology evolves. For 10+ years, we’ve been the industry leader in solving
    the challenges companies face in making high-quality hires – in one scalable platform.'
  items:
  - heading: Increased hiring ROI
    body: Consolidate your tech stack with a full workflow solution, from sourcing
      to onboarding · Work smarter, not harder, with embedded AI tools that automate
      more of the process · Make objective, data-driven hiring decisions for consistently
      better hires · Get immediate insights into your hiring funnel, enabling quick
      adjustments and continuous improvement
    meta: null
  - heading: One easy-to-use platform
    body: Manage every candidate touchpoint in one platform, from application to hire
      · Keep data structured and accessible with advanced configurations · Flex and
      scale your hiring capabilities with native solutions and integrations · Ensure
      security, compliance and governance without added complexity
    meta: null
  - heading: Proven industry leadership
    body: Partner with an established leader and innovator in the hiring space for
      10+ years · Get personalized guidance and support, ensuring successful adoption
      and continuous improvement · Access 24/7 resources and guidance to ensure your
      team is maximizing Greenhouse capabilities · Stay ahead of technology trends,
      including 20+ AI features already in the platform, with more on the way
    meta: null
