copy:
  eyebrow: null
  heading: The only hiring platform you’ll ever need
  subheading: null
  body: Save more, hire with confidence and move faster with AI-powered tools that
    streamline every step of the hiring process – from sourcing to onboarding.
  actions:
  - label: Sign In
    styleHint: outlined pill
  - label: Request a demo
    styleHint: filled-primary blue pill
  - label: Explore platform
    styleHint: filled-primary green pill
  - label: Request a demo
    styleHint: text-underline link
  items:
  - heading: Julia Mendoza
    body: Candidate
    meta: Interested / Sentiment updated
  - heading: View all candidates
    body: null
    meta: Summarize scorecards
  - heading: Welcome to Greenhouse!
    body: How can we help improve your hiring? This chat may be recorded and we may
      send you emails to follow up on our discussion here. Please see our Privacy
      Policy for more information.
    meta: null
  - heading: Candidates added by source
    body: Total count / Bar chart
    meta: Build a report
  logosLegible: []
