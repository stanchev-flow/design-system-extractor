chrome:
  casing: title
  separators: whitespace-only
  iconShape: none
  surfaceApprox: '#ffffff'
  linkTreatment: '17px #1f2d27 sans labels, evenly spaced'
  ctaTreatment: outlined white pill (Sign In) + filled blue pill (Request a demo),
    both hugging content
motionHints:
- arrow-free CTA pills with hover affordance
- curved connector lines suggest animated draw-in of floating cards
- chat toast + product chips suggest staged scroll-reveal
confidence: high
