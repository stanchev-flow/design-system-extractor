- id: features-staggered-caption-cards
  useCase: features
  archetypeRef: cards
  surfaceIntent: primary
  intent: "Two or three offset editorial feature modules on the cream field \u2014 each a module photo\
    \ + a tracked uppercase caption + a short body \u2014 on an uneven 1.2:1 grid with the second module\
    \ staggered downward so the columns never align. Structure harvested from the Claude Design layout\
    \ library #04; kept hard-edged (no card chrome, radius, shadow, or pills \u2014 arrow links only,\
    \ cq units, brand tokens)."
  contentShape:
    alignment: { value: left, counterweight: staggered-grid, inheritance: per-slot-override }
    slots:
    - name: card.image
      role: module photography
      mediaAspect: landscape
      mediaScale:
        of: slot
        fraction: 1.0
      width: media
      z: mid
    - name: card.caption
      role: tracked module caption
      textLen: short
      sizeClass: caption
      width: hug
      z: front
    - name: card.body
      role: module body
      textLen: long
      sizeClass: body
      width: hug
      sizeRel:
        to: slot
        ratio: 1.0
        axis: width
      z: front
  specialTreatments:
  - kind: stagger
    target: card.image
    axis: vertical
    amount:
      class: medium
  responsive:
    collapse: stack-below-tablet
    mediaFirst: false
  variantKnobs:
    cardCount:
      type: enum
      values:
      - 2
      - 3
      default: 2
    columnRatio:
      type: enum
      values:
      - 1.2fr 1fr
      - 1fr 1fr
      - 1.2fr 1fr 0.9fr
      default: 1.2fr 1fr
  origin: designed
  provenance:
  - claude-design-layout-library-dc
  designedFrom:
    note: "structure harvested from Claude Design 'Woodwave Layout Library' #04 Staggered Caption Cards\
      \ \u2014 per-card slots (card.image 16/10\xB74/3 \u2192 landscape/cover, card.caption 18\u201340ch\
      \ tracked 0.16em, card.body 100\u2013180ch ~44ch measure), uneven 1.2:1 columns + ~50px second-card\
      \ offset \u2192 vertical stagger. Styling NOT copied (drops radius/shadow/pills/vw)."
    sources:
    - claude-design-layout-library-dc
  overridable: true
  confidence: high
  source: creation
  scope: design-language
  changelog:
  - ts: '2026-07-01T00:00:00Z'
    action: created
    from: null
    to: features-staggered-caption-cards
    by: creation
    signalId: null
    note: 'harvested STRUCTURE from Claude Design layout library #04; drives the new `cards` archetype
      composer'
- id: editorial-interlocking-inset
  useCase: about
  archetypeRef: interlock
  surfaceIntent: primary
  intent: "The signature editorial interlock: a two-line tracked caption pinned top-left, one landscape\
    \ image floated into the upper-right, and a long serif statement heading that wraps around the image\
    \ \u2014 narrow beside it, then full width beneath. A float-wrap device (NOT the ghost-word collage).\
    \ Needs a 100+ch statement to interlock convincingly. Harvested from Claude Design layout library\
    \ #11; kept hard-edged (no radius/shadow/pills, cq units, no viewport units)."
  contentShape:
    alignment: { value: left, counterweight: inset-media, inheritance: per-slot-override }
    slots:
    - name: caption
      role: pinned two-line caption
      textLen: short
      sizeClass: caption
      width: hug
      z: front
    - name: inset
      role: inset statement photography
      mediaAspect: landscape
      mediaScale:
        of: container
        fraction: 0.52
      width: media
      z: mid
    - name: statement
      role: wrapping statement heading
      textLen: long
      sizeClass: display
      width: stretch
      z: front
  specialTreatments:
  - kind: float-wrap
    target: statement
    around: inset
    side: right
    dropAfter: caption
  - kind: inset
    target: inset
    side: right
    widthRel:
      to: container
      ratio: 0.52
  responsive:
    collapse: stack-below-tablet
    mediaFirst: false
  variantKnobs:
    floatSide:
      type: enum
      values:
      - left
      - right
      default: right
    insetMeasure:
      type: enum
      values:
      - half
      - wide
      default: wide
  origin: designed
  provenance:
  - claude-design-layout-library-dc
  designedFrom:
    note: "structure harvested from Claude Design 'Woodwave Layout Library' #11 Interlocking Statement\
      \ + Inset Image \u2014 slots (caption \u226440ch/2 lines tracked; inset image 3/2\u2192landscape\
      \ ~52% wide floated right; statement 100\u2013160ch serif heading wrapping around it), plus the\
      \ 'drop the headline under the caption so first lines sit left of the image' interlock note. Styling\
      \ NOT copied (drops radius/shadow/pills/vw)."
    sources:
    - claude-design-layout-library-dc
  overridable: true
