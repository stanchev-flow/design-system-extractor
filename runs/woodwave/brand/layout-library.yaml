schemaVersion: layout-patterns.v1
patterns:
- id: hero-display-over-staggered-media
  useCase: hero
  archetypeRef: stack
  surfaceIntent: inverse
  intent: Centered oversized didone display title layered over two hard-edged photos; the second, smaller
    photo is offset and crosses the first's lower edge (media-over-media).
  contentShape:
    alignment: { value: centered, inheritance: block-inherits }
    slots:
    - name: wordmark
      role: nav wordmark
      textLen: word
      sizeClass: caption
      width: hug
      z: front
    - name: title
      role: display title over media
      textLen: medium
      sizeClass: display
      width: hug
      z: front
    - name: hero-media
      role: hero photography
      mediaAspect: landscape
      mediaScale:
        of: container
        fraction: 0.8
      width: media
      z: mid
    - name: overlap-media
      role: overlap photography
      mediaAspect: portrait
      mediaScale:
        of: hero-media
        fraction: 0.34
      width: media
      z: front
    - name: subhead
      role: supporting lede
      textLen: long
      sizeClass: body
      width: hug
      z: front
  specialTreatments:
  - kind: overlap
    pair:
    - title
    - hero-media
    zOrder:
    - hero-media
    - overlap-media
    - title
    amount:
      class: heavy
    sanctioned: true
  - kind: overlap
    pair:
    - overlap-media
    - hero-media
    zOrder:
    - hero-media
    - overlap-media
    amount:
      class: medium
  - kind: stagger
    target: overlap-media
    axis: vertical
    amount:
      class: medium
  responsive:
    collapse: stack-below-tablet
    mediaFirst: false
  variantKnobs:
    titleOverlap:
      type: enum
      values:
      - light
      - medium
      - heavy
      default: heavy
    overlapMediaSide:
      type: enum
      values:
      - left
      - right
      default: right
  origin: extracted
  provenance:
  - opening-bookend
  confidence: high
  source: creation
  scope: design-language
  changelog:
  - ts: '2026-07-01T00:00:00Z'
    action: created
    from: null
    to: hero-display-over-staggered-media
    by: creation
    signalId: null
    note: extracted from opening-bookend
- id: editorial-ghostword-collage
  useCase: about
  archetypeRef: collage
  surfaceIntent: primary
  intent: 'Loose left-anchored editorial run: an oversized ghost watermark word behind a hard- edged photo
    with a short margin micro-caption, and a long paragraph offset to ~1/3 the container beside it. Overlap
    + alternating stagger are the only ornament.'
  contentShape:
    alignment: { value: left, counterweight: ghostword, inheritance: per-slot-override }
    slots:
    - name: ghostword
      role: watermark display word
      textLen: word
      sizeClass: colossal
      width: full-bleed
      opacityClass: ghost
      z: back
    - name: eyebrow
      role: section eyebrow
      textLen: short
      sizeClass: caption
      width: hug
      z: front
    - name: heading
      role: display heading
      textLen: medium
      sizeClass: display
      width: hug
      z: front
    - name: media
      role: module photography
      mediaAspect: freeform
      mediaScale:
        of: container
        fraction: 0.45
      width: media
      z: mid
    - name: caption
      role: margin micro-caption
      textLen: short
      sizeClass: caption
      width: hug
      z: front
    - name: body
      role: offset paragraph
      textLen: long
      sizeClass: body
      width: hug
      sizeRel:
        to: container
        ratio: 0.33
        axis: width
      z: front
  specialTreatments:
  - kind: ghost-word
    target: ghostword
    anchor: behind-media
    bleed: partial
  - kind: stagger
    target: media
    axis: horizontal
    amount:
      class: heavy
  - kind: marginal-caption
    target: caption
    side: left
  responsive:
    collapse: stack-below-tablet
    mediaFirst: false
    ghostwordAt:
      base: colossal
      tablet: hero
      mobile: hidden
  variantKnobs:
    ghostwordText:
      type: string
      from:
      - section-title
      - eyebrow
      default: eyebrow
    staggerAmount:
      type: enum
      values:
      - light
      - medium
      - heavy
      default: heavy
    bodyMeasure:
      type: enum
      values:
      - third
      - half
      default: third
  origin: extracted
  provenance:
  - about-run
  confidence: high
  source: creation
  scope: design-language
  changelog:
  - ts: '2026-07-01T00:00:00Z'
    action: created
    from: null
    to: editorial-ghostword-collage
    by: creation
    signalId: null
    note: "extracted from editorial-collage \u2014 captures ghost-word + short-caption/long-body size\
      \ relationship"
- id: features-flush-split-panel
  useCase: features
  archetypeRef: split
  surfaceIntent: inverse
  intent: 'Two flush halves (gap 0, hard cut): a full-height hard-edged photo beside a cream panel with
    a didone title, 1px-ruled label/value rows, and an arrow link.'
  contentShape:
    alignment: { value: left, counterweight: opposite-panel, inheritance: per-slot-override }
    slots:
    - name: eyebrow
      role: band eyebrow
      textLen: short
      sizeClass: caption
      width: hug
      z: front
    - name: band-heading
      role: band display heading
      textLen: medium
      sizeClass: display
      width: hug
      z: front
    - name: media
      role: flush photo half
      mediaAspect: portrait
      mediaScale:
        of: container
        fraction: 0.5
      width: stretch
      z: mid
    - name: panel-title
      role: panel title
      textLen: short
      sizeClass: title
      width: hug
      z: front
    - name: rows
      role: ruled label/value rows
      textLen: short
      sizeClass: body
      width: stretch
      z: front
    - name: action
      role: arrow link
      textLen: short
      sizeClass: caption
      width: hug
      z: front
  specialTreatments:
  - kind: bleed
    target: media
    edge: left
  responsive:
    collapse: stack-below-tablet
    mediaFirst: true
  variantKnobs:
    mediaSide:
      type: enum
      values:
      - left
      - right
      default: left
  origin: extracted
  provenance:
  - info-band
  confidence: high
  source: creation
  scope: design-language
  changelog:
  - ts: '2026-07-01T00:00:00Z'
    action: created
    from: null
    to: features-flush-split-panel
    by: creation
    signalId: null
    note: extracted from info-band
- id: cta-underline-conversion-stack
  useCase: cta
  archetypeRef: stack
  surfaceIntent: primary
  intent: "Narrow CENTERED column (~50% container) \u2014 one of only two sanctioned centered stacks (with\
    \ the hero). Eyebrow -> a FULL display-scale (H1) heading, multi-line, not a smaller title tier ->\
    \ short body -> underline-only form (placeholder + inline arrow submit). Body AND form share the SAME\
    \ measure (coherent centered column) \u2014 the form does NOT stretch to the full column width. No\
    \ boxed inputs, no filled button."
  contentShape:
    alignment:
      value: center
      inheritance: block-inherits
      rule: "CTA-type block: heading centered -> body + form centered, form measure = body measure (not\
        \ full column width). Contrast: a section-level header block may center only the heading while\
        \ the body run stays left-anchored \u2014 declare per-slot there instead of inheriting."
    slots:
    - name: eyebrow
      role: eyebrow
      textLen: short
      sizeClass: caption
      width: hug
      z: front
    - name: heading
      role: heading
      textLen: medium
      sizeClass: display
      width: hug
      z: front
    - name: body
      role: short body
      textLen: long
      sizeClass: body
      width: hug
      sizeRel:
        to: container
        ratio: 0.5
        axis: width
      z: front
    - name: form
      role: underline newsletter form
      textLen: short
      sizeClass: control
      width: hug
      sizeRel:
        to: body
        ratio: 1.0
        axis: width
      z: front
  specialTreatments: []
  responsive:
    collapse: none
    mediaFirst: false
  variantKnobs:
    align:
      type: enum
      values:
      - center
      - left
      default: center
  origin: extracted
  provenance:
  - conversion
  confidence: high
  source: creation
  scope: design-language
  changelog:
  - ts: '2026-07-01T00:00:00Z'
    action: created
    from: null
    to: cta-underline-conversion-stack
    by: creation
    signalId: null
    note: extracted from conversion-stack
  - ts: '2026-07-02T00:00:00Z'
    action: updated
    from: 'sizeClass: title, no centering applied'
    to: 'sizeClass: display, centered column + full-width form row'
    by: iteration
    signalId: null
    note: "fixed: composer/scaffold never implemented the recorded align:center knob, and heading sizeClass\
      \ didn't match voice.md's explicit H1 designation \u2014 spotted by comparing rendered output against\
      \ the source reference screenshot"
  - ts: '2026-07-02T00:10:00Z'
    action: updated
    from: 'form width: stretch (full column)'
    to: 'form width: hug, sizeRel to body (1.0) + alignment.rule captured'
    by: iteration
    signalId: null
    note: "fixed: form was stretched to the full 46rem column instead of matching body's measure, reading\
      \ visibly wider than the body text against the source reference \u2014 added the alignment-coherence\
      \ field so this class of gap is captured going forward, not just patched here"
- id: gallery-fullbleed-counter-band
  useCase: gallery
  archetypeRef: stack-fullbleed
  surfaceIntent: primary
  intent: "Full-bleed interior photograph, no overlay text. A thin utility row (eyebrow far left, static\
    \ counter far right) frames the band; a short caption sits in the margin below. No slider/carousel\
    \ controls \u2014 the counter is a static label."
  contentShape:
    alignment: { value: edge-to-edge, inheritance: per-slot-override }
    slots:
    - name: eyebrow
      role: band eyebrow (far left)
      textLen: short
      sizeClass: caption
      width: hug
      z: front
    - name: counter
      role: static index counter (far right)
      textLen: short
      sizeClass: caption
      width: hug
      z: front
    - name: media
      role: full-bleed interior photography
      mediaAspect: landscape
      mediaScale:
        of: container
        fraction: 1.0
      width: full-bleed
      z: mid
    - name: caption
      role: margin caption below band
      textLen: short
      sizeClass: caption
      width: hug
      z: front
  specialTreatments:
  - kind: bleed
    target: media
    edge: all
  - kind: marginal-caption
    target: caption
    side: left
  responsive:
    collapse: none
    mediaFirst: false
  variantKnobs:
    counterFormat:
      type: string
      default: N/M
  origin: extracted
  provenance:
  - gallery-showcase
  confidence: high
  source: creation
  scope: design-language
  changelog:
  - ts: '2026-07-01T00:00:00Z'
    action: created
    from: null
    to: gallery-fullbleed-counter-band
