  anatomy: circular icon button with chevron glyph; left disabled/greyed, right active
  sizing:
    widthBehavior: fixed
    approxPaddingPx: null
    radiusPx: 28
  surfaceApprox: '#ffffff'
  inkApprox: '#1c1c1a'
  caseTreatment: sentence
- kind: pill
  variant: carousel-dots
  countObserved: 3
  anatomy: row of 3 dots; first filled dark (active), other two light grey
  sizing:
    widthBehavior: hug
    approxPaddingPx: null
    radiusPx: 8
  surfaceApprox: '#1c1c1a'
  inkApprox: '#1c1c1a'
  caseTreatment: sentence
- kind: icon
  variant: rounded-square-tiles
  countObserved: 6
  anatomy: orange rounded-square tiles each holding a monochrome line glyph (chat, phone, person, chart,
