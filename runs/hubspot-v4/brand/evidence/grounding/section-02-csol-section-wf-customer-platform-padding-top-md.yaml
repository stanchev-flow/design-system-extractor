  sizing:
    widthBehavior: fixed
    approxPaddingPx: null
    radiusPx: 12
  surfaceApprox: '#e8845f'
  inkApprox: '#3a2a20'
  caseTreatment: sentence
copy:
  eyebrow: null
  heading: HubSpot's Agentic Customer Platform
  subheading: Connected data and tools make it easier to know, do, and connect everything across your
    business.
  body: HubSpot's Smart CRM is the single source of truth that connects all your business data.
  actions:
  - label: ‹
    styleHint: circular-neutral-icon-button
  - label: ›
    styleHint: circular-neutral-icon-button
  items:
  - heading: A CRM that’s really smart.
    body: HubSpot's Smart CRM is the single source of truth that connects all your business data.
    meta: null
media:
- kind: illustration
  treatment: isometric layered glass panels (orange front, green, purple, lavender) with floating icon
    tiles; labels 'Smart CRM', 'Hubs', 'Breeze'
  aspect: landscape
  approxFractionOfSection: 0.4
mediaAssets:
- kind: 3d-render
  subject: stacked translucent isometric panels with floating rounded-square icon tiles
  rightsGuess: own
  luminance: light
  busyness: medium
  aspect: landscape
  alphaEdge: true
  countObserved: 1
mediaComposition:
- mode: layered
  layers: back translucent lavender/purple panels -> mid green panel (Smart CRM) -> front orange panel
    with floating icon tile cluster
  bakedVsSeparable: reads as one baked 3D render artwork
  componentsOverMedia: none
generatedVisualDevices:
- kind: css-gradient
  evidence: translucent panel fills with soft graded tint suggest layered semi-opaque surfaces
  params: 'orange #f04a1e front, mint-green #dfe9e0, lavender #e5dcec panels'
  poster: stacked translucent isometric planes
motionHints:
- carousel dots (3, first active) indicate slide advance
- prev/next circular chevron arrows for slide navigation
- left arrow greyed suggests first slide of carousel
confidence: high
notes:
- carousel active on slide 1 of 3
- panel labels 'Smart CRM', 'Hubs', 'Breeze' set in italic sans
