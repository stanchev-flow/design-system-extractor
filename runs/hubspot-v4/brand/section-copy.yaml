    heading: 299,000+ customers in over 135 countries grow their businesses with HubSpot.
  copy-left-illustration-right-carousel:
    heading: HubSpot's Agentic Customer Platform
    subhead: Connected data and tools make it easier to know, do, and connect everything across your business.
    items:
    - heading: A CRM that’s really smart.
      body: HubSpot’s Smart CRM is the single source of truth that connects all your business data.
  sticky-copy-with-card-grid:
    eyebrow: Powered by AI
    heading: Growing a business is hard. HubSpot makes it easier.
    body: Disconnected tools and data slow you down. HubSpot connects everything — and everyone — in one place to
      make growing a business easier than you think.
    cta: Get a demo
    ghost: Get started free
    items:
    - heading: Marketing Hub®
      body: Attract and convert the right leads. Run campaigns, personalize content, and track it all.
      cta: Learn more
    - heading: Sales Hub®
      body: Generate quality leads and close deals, faster. Automate prospecting, manage pipeline, and accelerate
        revenue growth.
      cta: Learn more
    - heading: Service Hub®
      body: Streamline and scale support to serve customers faster. Drive retention with actionable insights, customer
        health scores, and real-time usage data.
      cta: Learn more
    - heading: Content Hub™
      body: Create content that clicks with your audience. Build pages, publish content across channels, and stay
        on brand.
      cta: Learn more
    - heading: Data Hub™
      body: Turn scattered data into unified intelligence. Combine, clean, and activate your customer data across
        every team and tool.
      cta: Learn more
    - heading: Revenue Hub™
      body: Make it easy for customers to pay you. Send quotes, collect payments, and manage subscriptions.
      cta: Learn more
    - heading: Smart CRM™
      body: All your customer data in one place. Keep your data clean, connected, and actionable.
      cta: Learn more
    - heading: Breeze™
      body: AI that works with you, and for you. Agents & assistants everywhere you need them.
      cta: Learn more
    - heading: Small Business Bundle
      body: The Starter edition of each product, at one low price.
      cta: Learn more
    - heading: AEO (Beta)
      body: See where your brand shows up in AI results. Get recommendations to improve your visibility.
      cta: Learn more
    ctaAriaLabel: Get a demo of HubSpot's software
    ghostAriaLabel: Get started free with HubSpot's free tools
  headrail-split-with-card-carousel:
    eyebrow: Explore Breeze Agents built-in AI that do work for you
    heading: Built-in AI agents that work for you 24/7.
    body: Breeze Agents are your always-on teammates. They can resolve over 65% of customer inquiries, accelerate
      your sales pipeline, and whip up quality content in no time.
    cta: Explore Breeze Agents
    items:
    - heading: Customer Agent
      body: Resolve 65% of your customer inquiries automatically.
      cta: Learn more about Customer Agent
    - heading: Prospecting Agent
      body: Spot buying signals, source contacts, and launch personalized outreach — instantly.
    - heading: Data Agent
      body: Get instant answers to customer questions about your customer data.
  copy-left-logo-collage-inset:
    heading: Works with the tools you already use. 2,000+ integrations.
    cta: See all app integrations
  headrail-two-col-header:
