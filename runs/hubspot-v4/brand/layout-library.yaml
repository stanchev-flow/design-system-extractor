- id: tabbed-testimonial-with-stats
  useCase: testimonial
  archetypeRef: split
  surfaceIntent: surface/primary
  origin: extracted
  confidence: high
  provenance:
  - section-07
  contentShape:
    containerWidth: contained
    columns: 2
    splitRatio: 55/45
    alignment:
      value: mixed
      inheritance: tabs-top-then-photo-left-quote-right-stats-bottom
    approxPaddingPx:
      top: 24
      bottom: 40
    gapPx: 40
    slots:
    - name: tab-row
      role: tab-row
      itemCount: 3
      z: front
      type: content
    - name: portrait
      role: ACTIVE panel case-study photograph (rounded 6px), swaps with the selected tab
      mediaAspect: landscape
      mediaScale:
        of: container
        fraction: 0.56
      z: front
      assets:
      - 045-unipart-1.png
      assetBindingProvenance: assets-manifest.json + section-07
      type: media
      mediaComposition:
        mode: state-swap
        trigger: tab
        layers:
        - assetRef: unipart-1
          forItem: Enterprise
        - assetRef: angel-fc
          forItem: Mid-Sized Business
        - assetRef: youth-on-course
          forItem: Small Business
    - name: quote
      role: body
      textLen: long
      sizeClass: body
      z: front
      type: content
    - name: attribution
      role: caption
      textLen: short
      sizeClass: caption
      z: front
      type: content
    - name: link
      role: text-underline-link
      sizeClass: control
      width: hug
      z: front
      type: content
    - name: stat-row
      role: stat-row
      itemCount: 2
      z: front
      type: content
    bandPadding:
      top: 1.5rem
      bottom: 2.5rem
    deviceGeometry:
      columnGap: 2.5rem
  specialTreatments:
  # Sanctioned TAB DEVICE (renderer stamps interaction devices from sanctioned
  # treatments): 3 text tabs, first (Enterprise) active = the JS-off / static-
  # capture truth. activeUnderline is the MEASURED active-tab rule color — the
  # module override `[aria-selected=true].cl-tab-button` sets border-bottom-color
  # to --cl-color-border-brand-01 (#ff4800 in the light theme; joined-evidence
  # action-05 cssRules). The page's committed-accent law collapses --c-accent to
  # ink on this band, so the device must ride the measured fact, not the page var.
  - kind: tabs
    target: tab-row
    sanctioned: true
    activeUnderline: rgb(255, 72, 0)
    note: 'captured states: active tab = bolder ink + accent-highlight underline (#ff4800, 4px);
      idle = muted-ink label; wash on hover/press. Tab labels/quotes/stats are the section''s own
      3 authored panels (section-copy panels), first active is the JS-off truth.'
  # Sanctioned STAT RULE: the stat pair/row spans the full card under photo+quote,
  # centered cells split by a vertical hairline divider (grounding section-07).
  - kind: stat-rule
    target: stat-row
    sanctioned: true
    note: number-over-caption stats split by a vertical hairline divider (2 stats on the active
      Enterprise panel; the other panels carry 3, per the source DOM)
  mediaComposition:
    mode: background-with-foreground
    layers:
    - assetRef: section-07-csol-section-breeze-agents-tabbed-testimonials-s.png
      role: portrait-media
  responsive:
    base: tab row, photo left / quote right, stat row across bottom
    mobile: photo stacks above quote, stats wrap
  gridRules:
    columns: 2
    gap: 40px
    split: 55/45
