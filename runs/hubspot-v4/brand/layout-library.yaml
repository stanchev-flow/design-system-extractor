recipes:
- id: section-headrail
  anatomy: leading marker + dotted leader rule + trailing quiet action
  origin: extracted
  confidence: high
  geometry:
    orientation: horizontal
    fullWidth: true
    ruleStyle: dotted
    alignment: space-between
  slots:
  - name: leading-marker
    role: marker
  - name: leader-rule
    role: divider
  - name: trailing-action
    role: quiet-action
  variants:
  - name: sparkle-chip
    leadingMarker: sparkle icon inside white rounded square chip (~66px, r16)
    trailingAction: outlined rounded-rect CTA (bordered, r14)
    provenance:
    - section-04
  - name: outlined-pill
    leadingMarker: outlined text label pill (thin border, r8)
    trailingAction: outlined CTA button (thin border, r8)
    provenance:
    - section-06
  usedBy:
  - headrail-split-with-card-carousel
  - headrail-two-col-header
  provenance:
  - section-04
  - section-06
