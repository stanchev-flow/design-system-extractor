schemaVersion: layout-patterns.v1
lane: hubspot-v3
source: screenshots/hubspot-v3/hubspot.html
viewport:
  w: 1440
  h: 900
layoutGrammar:
  actionGroup:
    pattern: dual-cta
    orientation: horizontal
    order:
    - primary
    - secondary
    gapPx: 16
    wrap: wrap-below-tablet
    alignment: inherits-block-alignment
    seamAbovePx: 40
    note: Observed multi-action rows pair exactly one filled orange primary with an outlined secondary,
      primary leading. Measured on hero (section-00) and elevated CTA (section-09); both center/left inherit
      the parent copy stack alignment. Single-action bands (sections 05, 06) collapse to one control.
    provenance:
    - section-00
    - section-09
patterns:
- id: full-bleed-photo-hero
  useCase: hero
  archetypeRef: overlay
  surfaceIntent: surface/inverse-teal
  origin: extracted
  confidence: high
  provenance:
  - section-00
  contentShape:
    containerWidth: full-bleed
    alignment:
      value: center
      inheritance: heading-body-and-actions-all-center
      siblingRule: Centered copy stack; dual CTA row centers under body. Floating chat card and toggle
        are bottom-right utilities outside the centered stack.
    approxPaddingPx:
      top: 200
      bottom: 80
    gapPx: 24
    slots:
    - name: eyebrow
      role: eyebrow
      textLen: short
      sizeClass: caption
      case: upper
      z: front
      type: content
    - name: heading
      role: display
      textLen: medium
      sizeClass: hero
      z: front
      specialTreatment: orange-period-accent
      type: content
    - name: body
      role: body
      textLen: medium
      sizeClass: body
      z: front
      type: content
    - name: actions
      role: action-group
      sizeClass: control
      width: hug
      z: front
      actionGroupRef: dual-cta
      type: content
    - name: background-media
      role: background-media
      mediaAspect: 1440 / 772
      mediaScale: cover
      opacityClass: full
      z: back
      assets:
      - 018-hs-full-bleed-1-optmised.webp
      assetBindingProvenance: assets-manifest.json + section-00
      type: media
    - name: utility-card
      role: floating-card
      textLen: short
      sizeClass: caption
      width: fixed
      z: front
      anchor: bottom-right
      type: content
    bandPadding:
      top: 12.5rem
      bottom: 5rem
    bandRhythm:
      eyebrowToHeading: 1.25rem
      headingToBody: 2.5rem
      bodyToCta: 2.5rem
  specialTreatments:
  - kind: text-on-media
    target: heading
    amountClass: full-scrim
  - kind: orange-period-accent
    target: heading
  - kind: floating-utility
    target: utility-card
    anchor: bottom-right
  mediaComposition:
    mode: background-with-foreground
    layers:
    - assetRef: section-00-csol-section-wf-page-header-wf-page-header-human.png
      role: background-media
    - role: copy-stack
    - role: action-group
    - role: floating-utility-card
  responsive:
    base: centered stack over full-bleed photo, dual CTA horizontal
    mobile: stacked CTA (wrap), reduced top padding
- id: centered-heading-over-logo-row
  useCase: logos
  archetypeRef: row
  surfaceIntent: surface/primary
  origin: extracted
  confidence: high
  provenance:
  - section-01
  contentShape:
    containerWidth: contained
    alignment:
      value: center
      inheritance: heading-and-row-center
    approxPaddingPx:
      top: 70
      bottom: 110
    gapPx: 130
    slots:
    - name: heading
      role: h2
      textLen: medium
      sizeClass: title
      z: front
      type: content
    - name: logo-row
      role: mark-row
      mediaAspect: wide
      z: front
      mediaScale:
        item:
          width: 120
          height: 28
      gap: 130
      assets:
      - 019-ebay-logo.svg
      - 020-doordash-logo.svg
      - 021-reddit-logo.svg
      - 022-tripadvisor-logo.svg
      - 023-eventbrite-logo.svg
      assetBindingProvenance: assets-manifest.json + section-01
      type: media
    bandPadding:
      top: 4.375rem
      bottom: 6.875rem
  specialTreatments:
  - kind: brand-colored-marks
    target: logo-row
  mediaComposition:
    mode: tiled-grid
    layers:
    - role: mark-row
      count: 5
  responsive:
    base: single row of 5 marks under centered heading
    mobile: wrap to 2-3 per row
- id: copy-left-illustration-right-carousel
  useCase: features
  archetypeRef: split
  surfaceIntent: surface/primary
  origin: extracted
  confidence: high
  provenance:
  - section-02
  contentShape:
    containerWidth: contained
    columns: 2
    alignment:
      value: mixed
      inheritance: header-stack-center-then-split-left-right
    approxPaddingPx:
      top: 80
      bottom: 90
    gapPx: 64
    slots:
    - name: heading
      role: h2
      textLen: short
      sizeClass: display
      z: front
      type: content
    - name: subheading
      role: body
      textLen: medium
      sizeClass: body
      z: front
      type: content
    - name: item-heading
      role: h3
      textLen: short
      sizeClass: title
      z: front
      type: content
    - name: item-body
      role: body
      textLen: medium
      sizeClass: body
      z: front
      type: content
    - name: illustration
      role: illustration-media
      mediaAspect: landscape
      mediaScale: contain
      z: front
      assets:
      - 024-customer-20platform-20graphic-20-20smart-20crm1-5x-20-1.png
      assetBindingProvenance: assets-manifest.json + section-02
      type: media
    - name: carousel-nav
      role: carousel-control
      sizeClass: control
      width: hug
      z: front
      anchor: bottom
      type: content
    bandPadding:
      top: 5rem
      bottom: 5.625rem
    deviceGeometry:
      columnGap: 4rem
  specialTreatments:
  - kind: carousel
    target: illustration
    controls: circular-chevron-plus-dots
    slideCount: 3
    activeIndex: 0
  mediaComposition:
    mode: layered
    layers:
    - assetRef: section-02-csol-section-wf-customer-platform-padding-top-md.png
      role: illustration-media
  responsive:
    base: copy left / layered 3D render right, nav below
    mobile: illustration stacks under copy
  gridRules:
    columns: 2
    gap: 64px
- id: sticky-copy-with-card-grid
  useCase: features
  archetypeRef: split
  surfaceIntent: surface/primary
  origin: extracted
  confidence: high
  provenance:
  - section-03
  contentShape:
    containerWidth: contained
    columns: 2
    splitRatio: 35/65
    alignment:
      value: left
      inheritance: sticky-copy-left-grid-right
    approxPaddingPx:
      top: 80
      bottom: 80
    gapPx: 32
    slots:
    - name: eyebrow
      role: eyebrow
      textLen: short
      sizeClass: caption
      z: front
      type: content
    - name: heading
      role: display
      textLen: medium
      sizeClass: display
      z: front
      type: content
    - name: body
      role: body
      textLen: long
      sizeClass: body
      z: front
      type: content
    - name: actions
      role: action-group
      sizeClass: control
      width: hug
      z: front
      actionGroupRef: dual-cta
      type: content
    - name: card-grid
      role: card-grid
      columns: 2
      rows: 5
      itemCount: 10
      z: front
      assets:
      - 028-producticons-marketinghub-icon-orange.webp
      - 029-producticons-saleshub-icon-orange.webp
      - 030-producticons-servicehub-icon-orange.webp
      - 031-producticons-contenthub-icon-orange.webp
      - 032-producticons-datahub-icon-orange.webp
      - 033-producticons-commercehub-icon-orange.webp
      - 034-producticons-smartcrm-icon-orange.webp
      - 035-breeze-20icon.svg
      - 009-small-business.svg
      - 027-ai-20sparkle.svg
      assetBindingProvenance: assets-manifest.json + section-03
      type: content
    bandPadding:
      top: 5rem
      bottom: 5rem
    bandRhythm:
      eyebrowToHeading: 2.5rem
      headingToBody: 2.5rem
      bodyToCta: 3.5rem
    deviceGeometry:
      columnGap: 2rem
  specialTreatments:
  - kind: sticky-column
    target: heading
    sanctioned: true
    navHeight:
      base: 56px
      wide: 76px
      wideMinWidth: 1080
    offset: 2rem
    provenance: 'section-03 .wf-product-platform__container-main.-sticky-sidebar { position:sticky; height:fit-content; top:calc(var(--sticky-sidebar-nav-height) + 2rem) }; measured nav-height 56px base / 76px @media(width>=1080px); offset 2rem; the copy column pins while the card grid scrolls, relative below the desktop split'
  - kind: dotted-divider
    target: card-grid
    note: dotted rules separate icon-header, bullet list, and link within each card
  cardAnatomy:
    slots:
    - name: card-icon
      role: spot-icon
      mediaAspect: square
    - name: card-heading
      role: h3
      sourceCopy: layoutCopy.featureGrid.items[].heading
    - name: card-body
      role: body
      sourceCopy: layoutCopy.featureGrid.items[].body
    - name: card-link
      role: text-arrow-link
      sourceCopy: layoutCopy.featureGrid.items[].cta
    radiusPx: 12
    borderApprox: 1px hairline
  responsive:
    base: sticky copy left, 2-col card grid right
    mobile: copy stacks above single-column card list
  gridRules:
    columns: 2
    gap: 32px
    split: 35/65
- id: headrail-split-with-card-carousel
