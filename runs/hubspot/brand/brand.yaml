  radius:
    # ROUNDED system — parsed from --cl-border-radius-* (the inverse of WoodWave's zeroed radius)
    card:    { value: "1rem",    mapsTo: "Card Radius",   var: "--cl-border-radius-container", status: mapped, source: saved-css, note: "16px container radius on cards" }
    button:  { value: "0.5rem",  mapsTo: "Button Radius", var: "--cl-border-radius-medium",    status: mapped, source: saved-css, note: "8px softly-rounded buttons (NOT pill)" }
    input:   { value: "0.25rem", mapsTo: "Input Radius",  var: "--cl-border-radius-input",     status: mapped, source: saved-css, note: "4px" }
    image:   { value: "1rem",    mapsTo: "Image Radius",  var: "--cl-border-radius-container",  status: mapped, source: saved-css, note: "16px; testimonial thumbnail uses 4px" }
