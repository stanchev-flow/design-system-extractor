# ── v2 CATALOG (consolidation pass 2026-07-02): primitives/blocks overrides against the
# shared contracts — added so the components gallery, composers, and the kit have a real
# catalog (the layouts below keep their original v1 componentMapping shape; the composer's
# v1 adapter normalizes them). Rules mirror the brand's own neverDo: FILLED buttons are
# the primary action grammar (never typographic), radius is 16px-rounded, text links dark.
contracts:
  primitives: "../../../brand_pipeline/contracts/primitives.yaml"
  blocks:     "../../../brand_pipeline/contracts/blocks.yaml"

primitives:
  heading:
    origin: extracted
    use: always
    rules: [ "display tiers use HubSpot Serif, sentence case (neverDo.no-allcaps-display)" ]
    provenance: [hero, results-header]
    confidence: high
  eyebrow:
    origin: extracted
    use: always
    rules: [ "microheading tagline register (e.g. 'Customer Platform')" ]
    provenance: [hero]
    confidence: high
  paragraph:
    origin: extracted
    use: always
    provenance: [hero, customer-platform]
    confidence: high
  button:
    origin: extracted
    use: always
    variant: filled-primary
    rules: [ "PRIMARY actions are FILLED orange buttons with white text — never typographic (neverDo.never-typographic-primary); secondary is orange-outline white-fill" ]
    provenance: [hero, elevated-cta]
    confidence: high
  link:
    origin: extracted
    use: text-links-only
    rules: [ "text links are DARK (#1f1f1f) and underlined — orange is reserved for the primary fill (neverDo.no-orange-links)" ]
    provenance: [customer-platform]
    confidence: high
  image:
    origin: extracted
    use: always
    rules: [ "photography full-bleed with flat dark scrim in the hero (no blur — neverDo.no-hero-blur); rounded 16px inside cards" ]
    provenance: [hero, case-studies-tabbed]
    confidence: high
  logo:
    origin: extracted
    use: always
    provenance: [navbar, logo-carousel]
    confidence: high
  input:
    origin: designed
    use: <when>
    designedFrom: { note: "no form observed on the captured page; synthesized as a rounded, bordered field to match the card system", neverDo: [no-brutalism], tokens: [accent/primary] }
    overridable: true
    confidence: low

blocks:
  header:
    origin: extracted
    slots:
      eyebrow: { use: optional }
      heading: { use: require }
      cta:     { use: optional, note: "FILLED primary button (see primitives.button)" }
    provenance: [hero, results-header]
    confidence: high
  navbar:
    origin: extracted
    provenance: [navbar]
    confidence: high
  footer:
    origin: extracted
    provenance: [footer]
    confidence: high
  form:
    origin: designed
    designedFrom: { note: "no lead form on the captured page; synthesized rounded field + filled submit to match the system" }
    overridable: true
    confidence: low

