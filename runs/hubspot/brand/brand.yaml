    stack-lg:            { value: "1.5rem", mapsTo: "Spacing/1.5x", status: mapped, source: saved-css }
    button-inset:        { value: "0.75rem 1.5rem", mapsTo: "Spacing/Button Inset", status: mapped, source: saved-css, note: "--cl-button-padding-medium (y x); -large = 1rem 2.5rem" }
    # ── canonical render-role ALIASES (2026-07-02 refresh) — same rationale as the color
    #    aliases: spacing_value() looks these names up directly (composer + preview :root).
    radius-global:       { value: "1rem", mapsTo: "Card Radius", status: mapped, source: saved-css, note: "ALIAS of radius/card+image (16px, the brand's signature rounding). LIMITATION: the renderers carry ONE --radius var, so buttons render at 1rem instead of their measured 0.5rem — the two-tier radius system (radius/button 0.5rem vs radius/card 1rem) is not representable; see tokens.radius for the real per-element values" }
    panel-padding:       { value: "2rem", mapsTo: "Spacing/Card Inset", status: mapped, source: saved-css, note: "ALIAS of card-padding leading edge (wf-product-platform__card 2rem)" }
    eyebrow-to-heading:  { value: "1rem", mapsTo: "Spacing/1x", status: mapped, source: saved-css, note: "ALIAS of stack-md — measured hero microheading -> heading gap" }
