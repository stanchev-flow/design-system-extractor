    neutral/inverse:         { value: "#1f1f1f", mapsTo: "Core Neutral/Neutral Inverse",   role: "surface-inverted (cta/footer/container-inverse-01)", status: mapped, source: saved-css, provenance: [elevated-cta, footer] }
    # text — parsed from --light-theme-text-* / --light-theme-link-*
    text/default:         { value: "#1f1f1f", mapsTo: "Core Text Color/Text Primary",   role: "text-default (text-01)", status: mapped, source: saved-css, provenance: [customer-platform, product-platform] }
    text/muted:           { value: "rgba(0,0,0,0.62)", mapsTo: "Core Text Color/Text Secondary", role: "text-muted (text-02)", status: mapped, source: saved-css, provenance: [product-platform, customer-platform] }
