# brand.yaml — canonical design language for HubSpot
# Authored by the brand-layout-analyst skill (Phases 1-4, source: creation).
# This file is CANONICAL. brand.md is a rendered projection — run render_brand_md.py.
# (SIGN-OFF #6) This file INDEXES the existing build artifacts listed under `indexes`;
# it references them and does NOT supersede or replace them.
#
# GROUND TRUTH: re-extracted from the locally saved "Save Page As, Complete" capture
# (real DOM + 26 CSS files + assets), NOT from the screenshot. Tokens are parsed from
# the page's --cl-* / --light-theme-* custom properties; sections are in real DOM order.
# HubSpot is the near-inverse of WoodWave: rounded SaaS cards on a near-white canvas,
# FILLED orange primary CTAs, a centered hero over a dark-scrim photo (NO blur),
# serif (HubSpot Serif) headings + HubSpot Sans body, generous soft-seam whitespace.

version: "1.0"

brand:
  name: "HubSpot"
  sourceUrl: "https://hubspot.com"
  targetSite: { name: "AISB v2 - test 1", siteId: "6a2b244f98ab655811c13cc2" }
  # ── BASE STYLE declaration (2026-07-02) — the style-layer identity this brand renders
  #    under: rounded/clean/centered SaaS, NOT the editorial grammar. NOTE (wiring gap,
  #    documented in REPORT.md): nothing in brand_pipeline consumes a brand-declared base
  #    style today — generate_composition takes --style per call, and
  #    render_components_preview.py builds its gallery with styles.inactive_context()
  #    (no style layer at all), so the gallery falls through to component_render/gallery
  #    CSS defaults that encode WoodWave's editorial DNA. This key states the intent so
  #    the wiring can land pipeline-side.
  baseStyle: corporate-saas-clean
  snapshot:
    value: >-
      A bright, rounded SaaS marketing system on a near-white canvas (#fcfcfa) led by
      a single vivid orange (#ff4800). Headings and large display copy use HubSpot
      Serif (the hero page-header uses HubSpot Serif Page Header Human at ~65px, weight
      300); HubSpot Sans carries body, UI, and buttons. Content sits in pure-white
      (#ffffff), 16px-rounded, borderless cards with dashed internal dividers, floating
      on near-white/cream surfaces and separated by generous vertical whitespace with
      gentle (non-hard-cut) soft transitions. The hero is a centered eyebrow→animated
      heading→body→single-primary-button stack over a full-bleed photograph darkened by
      a flat dark scrim (no blur). The primary action is a FILLED orange button with
      white text; the design system also defines an orange-outline white-fill secondary
      and a dark tertiary. Text links are DARK (#1f1f1f) and underlined — orange is
      reserved for the primary fill, brand borders (active-tab underline), check icons,
      and the rotating hero word. Dark (#1f1f1f) is reserved for the closing CTA band
      and the footer.
    confidence: high
    source: creation
    scope: design-language
    changelog:
      - { ts: "2026-06-16T01:50:00Z", action: created, from: null,
          to: "rounded orange SaaS marketing system (saved-page ground truth)", by: creation, signalId: null,
          note: "full re-extraction from the local Save-Page-As capture (DOM + 26 CSS + assets); replaces the screenshot-only pass" }
      - { ts: "2026-07-02T00:00:00Z", action: updated, from: "v1 extraction (no motion spec, hover states only on buttons)",
          to: "full-schema refresh: measured motionSpec, hover/interaction color tokens (incl. @media-nested footer link hover), tertiary button hover/pressed fills, re-bridged nav+footer measured chrome, canonical render-role alias tokens (surface/primary, accent/highlight, text/on-*, border/hairline-on-*, radius-global et al) so the shared renderers resolve real values", by: creation, signalId: null,
          note: "2026-07-02 end-to-end refresh from runs/hubspot/'captured page' via extract_chrome_saved.py + bridge_chrome_to_brand.py + captured-CSS interaction scan; pre-refresh snapshot at brand.yaml.pre-refresh-20260702.bak" }

# (SIGN-OFF #6) brand.yaml sits ABOVE these artifacts as a referencing index.
