    sm:        { value: "0px 1px 0px 0px rgba(20,20,20,0.24)", mapsTo: "Shadow/SM",   var: "--trellis-box-shadow-100", status: mapped, source: saved-css }
    card:      { value: "0px 8px 16px 0px rgba(20,20,20,0.16)", mapsTo: "Shadow/Card", var: "--trellis-box-shadow-200", status: mapped, source: saved-css, note: "used for floating/hover cards; default product cards are flat + dashed-divider" }
    lg:        { value: "0px 16px 32px 0px rgba(20,20,20,0.24)", mapsTo: "Shadow/LG", var: "--trellis-box-shadow-300", status: mapped, source: saved-css }
  surfaces:
    # NOTE (2026-07-02 correction): LIGHT surfaces carry NO textAccent. Two reasons:
    #  (a) factual — HubSpot never colors TEXT orange on light surfaces (text links are dark
    #      #1f1f1f + underline; neverDo.never-orange-text-link). Orange on light is a FILL
    #      (the primary button), which the button system carries, not the surface.
    #  (b) pipeline semantics — compose_section.root_vars uses surf.textAccent presence as
    #      its dark-surface heuristic (muted -> text/on-inverse-muted when set). With
    #      textAccent on a light surface the muted ink resolved to WHITE-on-near-white
    #      (measured 1.02:1 by the gate's text-contrast check on the 2026-07-02 live run).
    surface/base:    { bg: "#fcfcfa", schemeMode: "base (Primary)", textPrimary: text/default,  provenance: [logo-carousel, customer-platform, breeze-agents-carousel, integrations-rotating, results-header, case-studies-tabbed, badges] }
