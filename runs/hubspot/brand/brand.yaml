  assetsTaggedMd:   "./assets-tagged.md"                                     # human projection of assets-tagged.json
  savedPageHtml:    "../../../screenshots/hubspot/HubSpot/HubSpot _ Software & Tools for your Business - Homepage.html"
  savedPageAssets:  "../../../screenshots/hubspot/HubSpot/HubSpot _ Software & Tools for your Business - Homepage_files/"
  themeCss:         "../../../screenshots/hubspot/HubSpot/HubSpot _ Software & Tools for your Business - Homepage_files/hubspot-theme.stable.css"
  inventoryDir:     "../../../../docs/design-system-inventory/hubspot.com/"  # tokens.css/json, sections.json, patterns.json, descriptor.json, assets/
  voice:            "./voice.md"
  sourceScreenshot: "../../../screenshots/hubspot/HubSpot-Software-Tools-for-your-Business-Homepage-06-15-2026_11_58_PM copy.webp"
  # run-local capture (same Save-Page-As snapshot; used by the 2026-07-02 extraction refresh)
  capturedPageHtml:   "../captured page/HubSpot _ Software & Tools for your Business - Homepage.html"
  capturedPageAssets: "../captured page/HubSpot _ Software & Tools for your Business - Homepage_files/"
