compositionRules:
  - id: rounded-white-cards
    statement: "Content cards are pure white (#ffffff container-01), 16px-rounded, borderless, with DASHED internal dividers (1px rgba(0,0,0,0.11)); they float on near-white/cream surfaces. Elevation is subtle (rounding + contrast), not heavy shadow."
    value: { radius: "1rem", bg: "#ffffff", divider: "1px dashed rgba(0,0,0,0.11)", border: none, shadow: subtle }
    confidence: high
    source: saved-css
    scope: design-language
    changelog: [ { ts: "2026-06-16T01:50:00Z", action: created, from: null, to: "white 16px rounded borderless cards w/ dashed dividers", by: creation, signalId: null, note: "wf-product-platform__card + cl-card" } ]
  - id: filled-orange-primary
    statement: "The primary action is always a FILLED orange button (#ff4800 bg, #ffffff text, 8px radius). Secondary is a white-fill orange-outline button; tertiary is a DARK (#1f1f1f) underlined arrow text link. Never demote a primary CTA to a typographic link."
    value: { primary: filled, secondary: outline-white, tertiary: text-arrow-dark }
    confidence: high
    source: saved-css
    scope: design-language
    changelog: [ { ts: "2026-06-16T01:50:00Z", action: created, from: null, to: "filled/outline/dark-text ladder", by: creation, signalId: null, note: "parsed --light-theme-button-* and --light-theme-link-01" } ]
  - id: centered-hero-scrim
    statement: "The hero is a centered text stack over a full-bleed photo darkened by a flat dark scrim (rgba(0,0,0,0.5)); NO blur is applied. The final heading word rotates in brand orange."
    value: { align: center, overlay: scrim, blur: none }
    confidence: high
    source: [screenshot, saved-css]
    scope: design-language
    changelog: [ { ts: "2026-06-16T01:50:00Z", action: created, from: null, to: "centered, dark-scrim, no-blur hero", by: creation, signalId: null, note: "screenshot ground-truth; wf-page-header-human dark theme over photo" } ]
  - id: serif-headings-sans-body
    statement: "Headings and large display copy use HubSpot Serif (display); body, UI labels, buttons, and paragraphs use HubSpot Sans. The hero page-header uses HubSpot Serif Page Header Human."
    value: { headings: "HubSpot Serif", body: "HubSpot Sans", hero: "HubSpot Serif Page Header Human" }
    confidence: high
    source: saved-css
    scope: design-language
    changelog: [ { ts: "2026-06-16T01:50:00Z", action: created, from: null, to: "serif headings + sans body", by: creation, signalId: null, note: "--cl-font-family-heading = --cl-font-family-display = HubSpot Serif; --cl-font-family = HubSpot Sans" } ]
  - id: multicol-card-grids
    statement: "Feature/product sets are presented as multi-column card grids (product hubs = 2-column grid of 6 cards), not single long lists; the lead grid pairs a sticky 1/3 intro with a 2/3 card grid."
    value: { columns: 2, productCards: 6, sidebar: "1fr/2fr" }
    confidence: high
    source: saved-css
    scope: design-language
    changelog: [ { ts: "2026-06-16T01:50:00Z", action: created, from: null, to: "2-col card grids, 1fr/2fr lead split", by: creation, signalId: null, note: "wf-product-platform-container grid-template-columns 1fr 2fr; cards repeat(2)" } ]
  - id: generous-whitespace-soft-seams
    statement: "Sections breathe with generous vertical padding (csol -md = 40/64px up to -lg = 64/96px) and transition softly via surface tint shifts — no hard editorial cuts or hairline dividers between light sections."
    value: { sectionY: "2.5rem–6rem", transition: soft }
    confidence: high
    source: saved-css
    scope: design-language
    changelog: [ { ts: "2026-06-16T01:50:00Z", action: created, from: null, to: "generous whitespace, soft seams", by: creation, signalId: null, note: "csol padding tiers" } ]
  - id: dark-bookend-only
    statement: "Dark inverted (#1f1f1f) surfaces are reserved for the closing elevated-CTA band and the footer; the entire body run is near-white/cream/white."
    value: { darkSections: [ elevated-cta, footer ] }
    confidence: high
    source: saved-css
    scope: design-language
    changelog: [ { ts: "2026-06-16T01:50:00Z", action: created, from: null, to: "dark reserved for cta + footer", by: creation, signalId: null, note: "per-section data-cl-theme parse" } ]

do:
  - { id: rounded-white-cards,   statement: "Use pure-white (#ffffff), 16px-rounded, borderless cards with dashed internal dividers, floating on near-white/cream surfaces.", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }
  - { id: filled-primary-cta,    statement: "Make the primary CTA a FILLED orange button (#ff4800 / white text, 8px radius); secondary a white-fill orange-outline button.", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }
  - { id: centered-hero,         statement: "Center the hero text stack over a full-bleed photo with a flat dark scrim (no blur); rotate the final heading word in orange.", value: true, confidence: high, source: [screenshot, saved-css], scope: design-language, changelog: [] }
  - { id: serif-headings,        statement: "Set headings and display copy in HubSpot Serif; set body, buttons, and UI in HubSpot Sans (weight 300 body / 500 headings).", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }
  - { id: multicol-grids,        statement: "Present features and product hubs as multi-column card grids (2-col grid of 6 hub cards), with a sticky 1/3 intro beside a 2/3 grid.", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }
  - { id: generous-whitespace,   statement: "Use generous vertical whitespace (csol md→lg tiers) and soft surface-tint transitions between sections.", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }
  - { id: focused-orange-accent, statement: "Use the single vivid orange (#ff4800) as a focused accent: primary buttons, brand borders / active-tab underline, feature check icons, and the rotating hero word.", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }
  - { id: dark-text-links,       statement: "Render text links DARK (#1f1f1f) with an underline and a hover arrow; reserve orange for fills/borders/icons.", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }
  - { id: dark-bookend,          statement: "Use dark (#1f1f1f) inverted surfaces only for the closing CTA band and the footer.", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }

avoid:
  - { id: no-brutalism,         statement: "No hard-edged editorial brutalism; HubSpot is soft, rounded, friendly SaaS.", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }
  - { id: no-allcaps-display,   statement: "No all-caps didone/serif display at every tier; HubSpot Serif headings are sentence-case, and the serif Page-Header face is hero-only.", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }
  - { id: no-typographic-cta,   statement: "No typographic-only primary CTA; the primary action must be a FILLED button, never just an arrow/underline link.", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }
  - { id: no-zero-radius,       statement: "No zero-radius / sharp corners on cards (16px), buttons (8px), inputs (4px), or media.", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }
  - { id: no-orange-links,      statement: "Do NOT color text links orange; links are dark (#1f1f1f) underlined. Orange is for fills, brand borders, icons, and the rotating hero word only.", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }
  - { id: no-hero-blur,         statement: "Do NOT blur the hero background; darken it with a flat dark scrim only.", value: true, confidence: high, source: [screenshot], scope: design-language, changelog: [] }
  - { id: no-hard-cuts,         statement: "No hard-cut/contrast seams or hairline dividers between light sections; transition softly.", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }
  - { id: no-accent-overload,   statement: "Do not flood section surfaces with orange or pastels; keep large fields near-white/cream and use color as a focused accent / illustration backdrop.", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }
  - { id: no-pill-buttons,      statement: "Marketing CTAs are 8px-rounded, NOT full pills; the 999999px pill radius is reserved for tags / Breeze core components.", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }

neverDo:
  - { id: never-typographic-primary, statement: "Never render the primary CTA as a typographic link; it is always a filled orange button.", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }
  - { id: never-zero-radius,         statement: "Never zero out radius; the system is rounded (cards 16px, buttons 8px).", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }
  - { id: never-blur-hero,           statement: "Never apply blur to the hero background photo (flat dark scrim only).", value: true, confidence: high, source: [screenshot], scope: design-language, changelog: [] }
  - { id: never-orange-text-link,    statement: "Never color text links orange; text links are dark (#1f1f1f) and underlined.", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }
  - { id: never-allcaps-headings,    statement: "Never set headings in all-caps; HubSpot headings are sentence-case serif.", value: true, confidence: high, source: saved-css, scope: design-language, changelog: [] }

