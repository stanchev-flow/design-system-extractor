    overlay/scrim:        { value: "rgba(0,0,0,0.5)", mapsTo: "Core Overlay/Scrim",     role: "surface-overlay-scrim (hero darkening, NO blur)", status: mapped, source: [saved-css, screenshot], provenance: [hero] }
    # action mappings (button system uses these)
    action/primary-fg:    { value: "#ffffff", mapsTo: "Core Action/Primary FG",         role: "action-primary-fg (button-primary-text-color)", status: mapped, source: saved-css, provenance: [hero, elevated-cta] }
    # interaction / hover states — measured from the captured CSS (2026-07-02 refresh; incl. @media-nested rules)
    text/link-hover-on-inverse: { value: "#f8f5ee", mapsTo: "Core Text Color/Text Link Hover Inverse", role: "link hover on dark surfaces (footer/cta)", status: mapped, source: saved-css, provenance: [footer], note: "--dark-theme-hover-link-01; the governing rule '.global-footer a:not([class*=cl-button]):hover' is NESTED inside @media(width >= 900px) in template_footer-core-critical.min.css — also carried as footer.measured.linkHoverColor" }
    text/link-hover:            { value: "#1f1f1f", mapsTo: "Core Text Color/Text Link Hover", role: "link hover on light surfaces — SAME dark ink as idle; the hover signal is the underline/offset shift + arrow nudge, never an orange color swap", status: mapped, source: saved-css, provenance: [product-platform, integrations-rotating], note: "--light-theme-hover-link-01 == --light-theme-link-01 (#1f1f1f)" }
    overlay/hover-wash:         { value: "rgba(0,0,0,0.05)", mapsTo: "Core Overlay/Hover Wash", role: "hover wash on light surfaces (nav links, tabs, hoverable cards; --cl-color-hover-01)", status: mapped, source: saved-css, provenance: [navbar, case-studies-tabbed], note: "--light-theme-hover-01 rgba(0,0,0,0.0509…); cards add a 1px var(--cl-card-border-color) ring on hover" }
    overlay/hover-wash-inverse: { value: "rgba(255,255,255,0.05)", mapsTo: "Core Overlay/Hover Wash Inverse", role: "hover wash on dark surfaces (--dark-theme-hover-01)", status: mapped, source: saved-css, provenance: [elevated-cta, footer] }
    # ── canonical render-role ALIASES (2026-07-02 refresh) ─────────────────────────
    # The shared renderers (render_section / render_components_preview / compose_section /
    # component_render) resolve these EXACT role names via color_value(); a missing name
    # passes through as a raw string and the browser drops the declaration. Each alias
    # carries the SAME measured value as its HubSpot-named twin above (single source:
    # the captured CSS) — they are role bindings, not new colors.
    surface/primary:            { value: "#fcfcfa", mapsTo: "Background Color/Background Primary", role: "ALIAS of neutral/surface-base — canonical page-canvas role consumed by the renderers", status: mapped, source: saved-css, provenance: [logo-carousel, customer-platform, results-header] }
