    border/strong:        { value: "#1f1f1f", mapsTo: "Core Border/Border Strong",      role: "border-strong (border-01)", status: mapped, source: saved-css, provenance: [case-studies-tabbed] }
    border/brand:         { value: "#ff4800", mapsTo: "Core Border/Border Brand",       role: "brand border / active-tab underline (border-brand-01)", status: mapped, source: saved-css, provenance: [case-studies-tabbed] }
    # decorative pastel accent backdrops — parsed from --light-theme-background-accent-*
    accent/sage:          { value: "#b9cdbe", mapsTo: "Core Accent/Accent Sage",        role: "illustration/elevated-cta backdrop (background-accent-01)", status: mapped, source: saved-css, provenance: [customer-platform] }
    accent/lilac:         { value: "#d6c2d9", mapsTo: "Core Accent/Accent Lilac",       role: "illustration/elevated-cta backdrop (background-accent-02)", status: mapped, source: saved-css, provenance: [customer-platform] }
    accent/pink:          { value: "#fcc3dc", mapsTo: "Core Accent/Accent Pink",        role: "illustration/elevated-cta backdrop (background-accent-03)", status: mapped, source: saved-css, provenance: [customer-platform] }
