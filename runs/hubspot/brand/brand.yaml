    text/on-primary:            { value: "#1f1f1f", mapsTo: "Core Text Color/Text Primary", role: "ALIAS of text/default — canonical ink-on-light role", status: mapped, source: saved-css }
    text/on-primary-muted:      { value: "rgba(0,0,0,0.62)", mapsTo: "Core Text Color/Text Secondary", role: "ALIAS of text/muted — canonical muted-ink-on-light role", status: mapped, source: saved-css }
    text/on-inverse:            { value: "#ffffff", mapsTo: "Core Text Color/Text Inverted", role: "ALIAS of text/inverted — canonical ink-on-dark role", status: mapped, source: saved-css, provenance: [elevated-cta, footer] }
    text/on-inverse-muted:      { value: "rgba(255,255,255,0.62)", mapsTo: "Core Text Color/Text Inverted Secondary", role: "canonical muted-ink-on-dark role — measured footer idle link color (footer.measured.link.color)", status: mapped, source: saved-css, provenance: [footer] }
    text/on-accent:             { value: "#ffffff", mapsTo: "Core Action/Primary FG", role: "ALIAS of action/primary-fg — label color on the orange accent fill", status: mapped, source: saved-css, provenance: [hero, elevated-cta] }
