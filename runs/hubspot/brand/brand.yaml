    surface/inverse-strong:     { value: "#1f1f1f", mapsTo: "Background Color/Background Inverse", role: "ALIAS — HubSpot has ONE dark surface; strong == inverse (#1f1f1f)", status: mapped, source: saved-css, provenance: [footer] }
