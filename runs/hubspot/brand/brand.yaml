    # borders — parsed from --light-theme-border-*
    border/default:       { value: "rgba(0,0,0,0.11)", mapsTo: "Core Border/Border Primary", role: "border-default / dashed card dividers (border-03)", status: mapped, source: saved-css, provenance: [product-platform, case-studies-tabbed] }
