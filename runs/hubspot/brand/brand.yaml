      body-md:      { family: sans,    sizeRem: 1.0,    line: 1.5,  weight: 300, case: sentence, mapsTo: "Text MD/MD Text Size", source: saved-css }
      body-sm:      { family: sans,    sizeRem: 0.875,  line: 1.5,  weight: 300, case: sentence, mapsTo: "Text SM/SM Text Size", source: saved-css, note: "card feature bullets" }
      eyebrow:      { family: sans,    sizeRem: 0.875,  line: 1.5,  weight: 500, letterSpacing: "0.04em", case: none, mapsTo: "Eyebrow/Eyebrow Size", source: saved-css, note: "cl-p -microheading (hero tagline)" }
      button-md:    { family: button,  sizeRem: 1.0,    line: 1.5,  weight: 500, letterSpacing: "0em", case: none, mapsTo: "Button Font/Button Size", source: saved-css, note: "--cl-button-font-size medium; normal tracking (.cl-button sets no letter-spacing)" }
      button-lg:    { family: button,  sizeRem: 1.125,  line: 1.5,  weight: 500, letterSpacing: "0em", case: none, mapsTo: "Button Font/Button Size", source: saved-css, note: "-large button; normal tracking" }
  spacing:
