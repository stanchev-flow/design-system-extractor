    border/hairline-on-inverse: { value: "rgba(255,255,255,0.4)", mapsTo: "Core Border Color/Border Inverse", role: "canonical hairline-on-dark role — --dark-theme-border-02 (footer nav-column dividers .global-footer__nav-column border-bottom)", status: mapped, source: saved-css, provenance: [footer] }
  type:
