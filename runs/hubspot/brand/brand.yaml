      display: { value: "HubSpot Serif", mapsTo: "Font/Heading Font", role: "--cl-font-family-display / --cl-font-family-heading (headings + display)", source: saved-css }
      heroDisplay: { value: "HubSpot Serif Page Header Human", mapsTo: "Font/Heading Font", role: "hero page-header heading face only", source: saved-css }
