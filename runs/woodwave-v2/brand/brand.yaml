    radius: "0rem"            # SHARP — measured border-radius 0
    padding: "0.5625rem 0.9375rem"  # measured 9px 15px
    height: "2.625rem"        # 42px measured (_rect h 41.59)
    font: "Satoshi"
    weight: 400
    sizeRem: 1.125            # 18px measured
    letterSpacing: "0.0625rem"  # 1px measured
    case: none                # measured text-transform none
    confidence: high
    source: [saved-css, computed]
    provenance: [nav, hero]
    note: "the espresso-plate filled button with a cream hairline border and cream label — the gallery's one solid control (measured .buy-button)."
  secondary:
    style: outline
    bg: "transparent"
    border: "1px solid #32271a"   # the inverse on cream: espresso hairline
    fg: "#32271a"
    bgHover: "#32271a"            # hover FILLS with espresso
