# CONTEXTUAL header-alignment grammar (brand-schema §4.4b). Split sections anchor
# the copy column LEFT with a media counterweight (visit map/card, ticket rows).
# The standalone opener bands (hero, newsletter) center their stacks.
layoutGrammar:
  headerContext:
    splitColumn:
      anchor: left
      counterweight: media
      evidence: "the 2 split patterns anchor copy left with a media counterweight (visit-map-card + ticket-pricing-rows: alignment.value=left, counterweight media)"
    standaloneStack:
      anchor: centered
      evidence: "the standalone opener bands center their stacks (grounding hero + newsletter: alignment center); the editorial about/founder bands anchor left as explicit pattern facts (outrank this default by resolution order)"
    confidence: high
    source: [vision, computed]
    scope: design-language
    changelog:
      - { ts: "2026-07-17T13:45:00Z", action: created, from: null, to: "splitColumn=left / standaloneStack=centered", by: creation, signalId: null, note: "derived from the 7 grounded sections' header alignment by layout context" }
  actionGroup:
    gap: 1.5rem
    orientation: row
    wrap: wrap
    align: start
    marginAbove: ladder
    registers: [primary, secondary]
    source: vision
    provenance: [visit, newsletter]
    confidence: medium
    changelog:
      - { ts: "2026-07-17T13:45:00Z", action: created, from: null, to: "gap 1.5rem / wrap / start / marginAbove ladder", by: creation, signalId: null, note: "the gallery's actions are mostly single text-arrow links; the pricing rows stack BUY TICKETS links at ~24px rhythm (grounding visit)" }

buttons:
  renderHint: { useFilledButton: true, note: "The brand's ONE filled control is the buy-button — a dark espresso plate with a 1px CREAM hairline border and cream uppercase label, SHARP corners (radius 0). Most gallery CTAs are typographic text-arrow links (BUY TICKETS / SUBSCRIBE). Renderer MUST emit the filled rectangle for primary actions and the uppercase text-arrow for quiet actions; NEVER a pill." }
