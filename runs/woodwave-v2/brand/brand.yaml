# BRAND SIGNATURES (brand-schema §4.7) — the 4 moves that make WoodWave
# recognizable, each a MACHINE-CHECKABLE always/never rule for signature_audit.py.
signatures:
  - id: melodrama-display-satoshi-body
    kind: type-treatment
    mode: always
    claim: >-
      Display ranks speak Melodrama (proxy Playfair Display) UPPERCASE; running text
      and controls speak Satoshi (proxy Manrope). A sans display or a serif body
      breaks the gallery's editorial register.
    check:
      probes:
        - { "on": display, familyIncludesAny: ["Melodrama", "Playfair"] }
        - { "on": body, familyIncludesAny: ["Satoshi", "Manrope"] }
        - { "on": button, familyIncludesAny: ["Satoshi", "Manrope"] }
    evidence:
      - "computed-styles.json headings: h1 'Melodrama' 175.68px, h3 'Melodrama' 80px; body/p 'Satoshi' 24px"
      - "tokens.type: display-hero/h1/h2/h3 family Melodrama; body/eyebrow/control-text Satoshi"
    confidence: high
    source: [computed, saved-css]
    changelog:
      - { ts: "2026-07-17T13:45:00Z", action: created, from: null, to: authored, by: creation, signalId: null, note: "authored from computed type facts" }
  - id: sharp-corner-controls
    kind: shape-motif
    mode: always
    claim: >-
      Controls corner SHARP (0px) — buttons, fields and plates are hard rectangles,
      NEVER pills or soft rectangles. The 0 radius is the working surface corner.
    check:
      buttons: { radiusPx: 0, tolerancePx: 1.5 }
      neverPill: true
    evidence:
      - "computed-styles.json actionGroups: buy-button + submit border-radius 0px"
      - "tokens.radius.sharp 0rem (the brand control corner); the 50%/3px census entries are webflow lightbox/slider chrome"
    confidence: high
    source: [computed, saved-css]
    changelog:
      - { ts: "2026-07-17T13:45:00Z", action: created, from: null, to: authored, by: creation, signalId: null, note: "authored from measured control radii" }
  - id: warm-dark-surface-family
    kind: surface-habit
    mode: never
    claim: >-
      Dark surfaces come ONLY from the licensed warm-dark family — espresso #32271a
      and the near-black footer #181313 (photo bands underlay #2a2018). Never a
      generic black, navy, or cool grey as a section surface.
    check:
      darkMaxLuminance: 0.22
      darkAllowedColors: ["#32271a", "#181313", "#2a2018"]
    evidence:
      - "tokens.surfaces: inverse #32271a, inverse-strong #181313, photo-hero #2a2018 (schemeMode Inverse)"
      - "measured body background rgb(50,39,26); footer bg rgb(24,19,19); the site's --dark/--footer tokens"
    confidence: high
    source: [computed, saved-css]
    changelog:
      - { ts: "2026-07-17T13:45:00Z", action: created, from: null, to: authored, by: creation, signalId: null, note: "authored from the site's own dark tokens" }
  - id: uppercase-tracked-labels
    kind: type-treatment
    mode: always
    claim: >-
      Eyebrows, nav, and control labels are UPPERCASE Satoshi with positive letter
      tracking (~1px); the display headings are uppercase Melodrama with 2px
      tracking. Sentence-case labels or untracked caps break the register.
    check:
      probes:
        - { "on": eyebrow, caseIs: uppercase }
        - { "on": button, caseIs: uppercase }
    evidence:
      - "css-facts textTransformCensus: 16 uppercase; letterSpacingCensus: 1px x8, 2px x1"
      - "computed h5/eyebrow 18px uppercase ls 1px; h1/h3 uppercase ls 2px; control-text uppercase"
    confidence: high
    source: [computed, saved-css]
    changelog:
      - { ts: "2026-07-17T13:45:00Z", action: created, from: null, to: authored, by: creation, signalId: null, note: "authored from the uppercase + tracking censuses" }

