      - { name: "eyebrow", type: content, role: "chrome eyebrow ('GALLERY') over the photo" }
      - { name: "media",   type: media,   role: "6 full-bleed gallery photos", assets: [ "009-657acd8d782ab334f6b2e5e5-web-gallery-1-p-1600.jpg", "010-657acd8d782ab334f6b2e5e6-web-gallery-2-p-1600.jpg", "011-657acd8d782ab334f6b2e5e7-web-gallery-3-p-1600.jpg", "012-657acd8d782ab334f6b2e5e8-web-gallery-4.jpg", "013-657acd8d782ab334f6b2e5e9-web-gallery-5.jpg", "014-657acd8d782ab334f6b2e5f2-web-gallery-6.jpg" ] }
      - { name: "controls", type: content, role: "slide counter (1/6) + numeric dot rail + circular arrow" }
