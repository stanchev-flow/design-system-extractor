# brand.yaml — canonical design language for WoodWave Gallery
# (woodwavegallery.webflow.io) — "WoodWave v2"
# Authored 2026-07-17 by the extraction agent from a FRESH LIVE capture
# (screenshots/woodwave-v2/, Playwright 1440x900) through the evidence-first flow
# (run_brand_extraction.py mine-dom → mine-css → mine-motion → measure → slice →
# ground → curate; spec/layout-analyst-skill.md authoring protocol).
#
# MEASUREMENT SOURCES (evidence/ bundle, all reproducible):
#  - evidence/css-facts.json + evidence/css-rules.json: the site's OWN custom
#    properties --yellow #edd580 / --white #fbf4ed / --dark #32271a /
#    --footer #181313; buy-button hover #1d170f; radius census (brand controls 0);
#    text-transform census (16 uppercase); letter-spacing 1px/2px.
#  - evidence/computed-styles.json — JS-off getComputedStyle @1440 + the
#    1920/1440/960/375 tier ladder: hero H1 Melodrama 175.68px gold uppercase;
#    section H3 Melodrama 80px espresso uppercase; body Satoshi 24px; container
#    1300px at every tier; footer bg #181313; 2 action families (buy-button filled,
#    submit text).
#  - evidence/motion-audit.json — 10 transition rules, 1 animation, 1 keyframe;
#    duration census 100/200/250/300/800ms; easings linear + ease-in-out.
#  - evidence/grounding/*.yaml — 7 per-section VISION grounding files
#    (claude-opus-4-8): surfaces w/ parents, per-section type + component inventory,
#    verbatim copy, media creative direction, mediaComposition modes.
#
# WoodWave reads as a WARM, EDITORIAL ART-GALLERY system, DARK-FIRST: a deep
# espresso canvas (#32271a) alternating with warm cream bands (#fbf4ed), a single
# GOLD accent (#edd580) carrying the hero wordmark + hover states + the logo, a
# high-contrast Melodrama display face set OVERSIZED and UPPERCASE (the hero
# wordmark fills the band), a Satoshi grotesque body at a generous 24px, SHARP
# corners everywhere (radius 0 — a signature), slash-separated nav + footer link
# rows, oversized pale ghost-watermark type behind headings, uppercase text-arrow
# link CTAs (BUY TICKETS / SUBSCRIBE), and a near-black footer (#181313) with
# muted-warm-grey links that brighten to gold.

version: "1.1"

brand:
  name: "WoodWave Gallery"
  sourceUrl: "https://woodwavegallery.webflow.io"
  baseStyle: editorial-gallery-warm-dark
  snapshot:
    value: >-
      A warm, editorial art-gallery system on a DARK-FIRST rhythm: a deep espresso
      canvas (#32271a — the site's own --dark token) alternates band-by-band with
      warm cream (#fbf4ed — --white) and closes on a near-black footer (#181313 —
      --footer). One GOLD accent (#edd580 — --yellow) carries the hero wordmark, the
      logo mark, and every hover state (nav/footer links brighten to gold). Display
      voice is Melodrama — a high-contrast didone-style serif set OVERSIZED and
      UPPERCASE: the hero wordmark paints at ~176px filling the band; section
      headings run 80px uppercase with 2px tracking. Working voice is Satoshi, a
      geometric grotesque, at a generous 24px/1.4 body and an 18px uppercase
      1px-tracked eyebrow/control register. Corners are SHARP everywhere (radius 0 —
      the one filled button, a dark espresso plate with a 1px cream hairline border,
      is a hard rectangle). CTAs are typographic: uppercase text-arrow links
      (BUY TICKETS, SUBSCRIBE) trailing a small arrow glyph; nav and footer link
      rows are slash-separated. Sections open with an uppercase Satoshi eyebrow over
      a Melodrama display heading, frequently backed by an OVERSIZED pale
      ghost-watermark word (ABOUT / 1974-2023). Media is warm-toned gallery
      photography — spiral wooden interiors, sculpture halls, terracotta vessels —
      placed as full-bleed bands, overlapping clusters, and a counted slider (1/6).
    confidence: high
    source: creation
    scope: design-language
    changelog:
      - { ts: "2026-07-17T13:45:00Z", action: created, from: null,
          to: "warm editorial gallery, dark-first espresso/cream/gold, Melodrama display + Satoshi body, sharp corners, slash nav, ghost watermarks, text-arrow CTAs",
          by: creation, signalId: null,
          note: "first extraction for the woodwave-v2 lane — evidence-first from the site's own --dark/--white/--yellow/--footer tokens + JS-off measures + 7 vision groundings" }

meta:
  # canonical-tier discipline (validator C14): every canonical value in this file
  # (sizeRem.base, spacing value:, radius value:) refers to the 1440px measured tier
  # unless a tier ladder says otherwise. measure sampled 1920/1440/960/375
  # (evidence/computed-styles.json `tiers`).
  canonicalTier:
    viewport: 1440
    label: base
    note: "sizeRem.base == computed @1440; the espresso/cream registers are stable
      1440→1920 (container caps at 1300px); the Melodrama display + body step down
      at 960 and 375 per the measured ladder"
    measuredTiers: [1920, 1440, 960, 375]
    source: computed
    provenance: [evidence/computed-styles.json]

indexes:
  assetsTagged:     "./assets-tagged.json"
  savedPageHtml:    "../../../screenshots/woodwave-v2/woodwave.html"
  savedPageAssets:  "../../../screenshots/woodwave-v2/woodwave_files/"
  sourceScreenshot: "../../../screenshots/woodwave-v2/woodwave-fullpage.png"
  voice:            "./voice.md"
  layoutLibrary:    "./layout-library.yaml"
  sectionCopy:      "./section-copy.yaml"
  mediaAssets:      "./media-assets.yaml"
  evidenceBundle:   "./evidence/"
  cssFacts:         "./evidence/css-facts.json"
  cssRules:         "./evidence/css-rules.json"
  computedStyles:   "./evidence/computed-styles.json"
  domCensus:        "./evidence/dom-sections.json"
  motionAudit:      "./evidence/motion-audit.json"
  visionGrounding:  "./evidence/grounding/"

tokens:
  colors:
    # ── ink / neutrals ──
    ink/primary:      { value: "#32271a", role: "espresso — heading + body ink on cream surfaces (measured h3/p/body color rgb(50,39,26))", status: mapped, source: [saved-css, computed], provenance: [about, founder-story, newsletter] }
    ink/muted:        { value: "#6b5d50", role: "muted warm ink — placeholder / control-label on cream (grounding newsletter control-label #6b5d50)", status: mapped, source: vision, provenance: [newsletter] }
    ink/on-dark:      { value: "#fbf4ed", role: "cream ink on the espresso/near-black bands (--white; hero/visit/footer ink)", status: mapped, source: [saved-css, vision], provenance: [hero, visit, footer] }
    ink/on-dark-muted: { value: "#a09a94", role: "muted warm-grey link ink on the footer band (grounding footer nav/social #a09a94)", status: mapped, source: vision, provenance: [footer] }
    # ── surfaces ──
    neutral/cream:    { value: "#fbf4ed", role: "warm cream — the light content canvas + cream cards (--white; about/newsletter canvas, info card)", status: mapped, source: [saved-css, vision], provenance: [about, newsletter, visit] }
    neutral/cream-raised: { value: "#f7efe8", role: "raised cream step (grounding about/newsletter canvas #f7ede6/#f7efe8)", status: mapped, source: vision, provenance: [about, newsletter] }
    surface/espresso: { value: "#32271a", role: "deep espresso dark band (--dark; hero + visit canvas; measured body background rgb(50,39,26))", status: mapped, source: [saved-css, computed], provenance: [hero, visit] }
    surface/near-black: { value: "#181313", role: "near-black footer band (--footer; measured footer bg rgb(24,19,19))", status: mapped, source: [saved-css, computed], provenance: [footer] }
    # ── gold accent — the brand's ONE accent ──
    accent/gold:      { value: "#edd580", role: "gold accent (--yellow): the hero wordmark ink, the logo mark, and EVERY link hover (nav/footer links brighten to gold — css hoverRules color: var(--yellow))", status: mapped, source: [saved-css, computed], provenance: [hero, footer] }
    # ── interaction / borders ──
    action/primary-hover: { value: "#1d170f", role: "the filled buy-button's measured hover fill (.buy-button:hover background-color #1d170f)", status: mapped, source: saved-css, provenance: [nav] }
    border/hairline:  { value: "rgba(50, 39, 26, 0.2)", role: "hairline divider on cream (footer legal rules, ruled price rows) — the espresso ink at low alpha (#32271a33 in the css color census)", status: mapped, source: saved-css, provenance: [visit, footer] }
    border/on-dark:   { value: "#fbf4ed", role: "cream hairline border — the filled button's 1px border on the espresso plate (measured buy-button border 1px solid rgb(251,244,237))", status: mapped, source: computed, provenance: [nav, hero] }
    border/hairline-on-inverse: { value: "rgba(251, 244, 237, 0.2)", role: "cream hairline at low alpha — footer social/legal divider rules on the near-black band", status: mapped, source: vision, provenance: [footer] }
    media/map-grey:   { value: "#8a8a8a", role: "greyscale street-map fill (third-party map media well)", status: mapped, source: vision, provenance: [visit] }
    # ── canonical render-role ALIASES — the shared renderers resolve these EXACT names ──
    surface/primary:        { value: "#fbf4ed", role: "ALIAS of neutral/cream — canonical page-canvas role (the warm cream content surface)", status: mapped, source: saved-css, provenance: [about, newsletter] }
    surface/panel:          { value: "#fbf4ed", role: "ALIAS of neutral/cream — canonical panel/card role (cream cards float on the dark bands: the visit info card, gallery frames)", status: mapped, source: [saved-css, vision], provenance: [visit] }
    surface/raised:         { value: "#f7efe8", role: "ALIAS of neutral/cream-raised — canonical raised-light role", status: mapped, source: vision, provenance: [about] }
    surface/inverse:        { value: "#32271a", role: "ALIAS of surface/espresso — canonical dark band role (hero, visit)", status: mapped, source: [saved-css, computed], provenance: [hero, visit] }
    surface/inverse-strong: { value: "#181313", role: "ALIAS of surface/near-black — the near-black chrome dark (footer)", status: mapped, source: [saved-css, computed], provenance: [footer] }
    accent/highlight:            { value: "#edd580", role: "ALIAS of accent/gold — canonical accent role (the one gold; display ink on dark, logo mark, link-hover)", status: mapped, source: saved-css, provenance: [hero, footer] }
    accent/highlight-on-inverse: { value: "#edd580", role: "accent ON dark surfaces — the gold is scheme-stable (hero wordmark + footer logo both gold on dark)", status: mapped, source: [saved-css, computed], provenance: [hero, footer] }
    text/on-primary:        { value: "#32271a", role: "ALIAS of ink/primary — canonical ink-on-light role", status: mapped, source: computed }
    text/on-primary-muted:  { value: "#6b5d50", role: "ALIAS of ink/muted — canonical muted-ink-on-light role", status: mapped, source: vision }
    text/on-inverse:        { value: "#fbf4ed", role: "canonical ink-on-dark role (cream; hero/visit/footer headings measured cream)", status: mapped, source: [saved-css, vision], provenance: [hero, visit, footer] }
    text/on-inverse-muted:  { value: "#a09a94", role: "canonical muted-ink-on-dark role (footer links #a09a94)", status: mapped, source: vision, provenance: [footer] }
    text/on-accent:         { value: "#32271a", role: "ink on the gold accent — espresso reads on gold (contrast)", status: mapped, source: creation }
    text/ghost-on-primary:  { value: "rgba(50, 39, 26, 0.05)", role: "canonical ghost-on-light role — bound to a faint espresso wash so any ghost/placeholder fallback stays on-palette (WoodWave has no ghost-button device)", status: mapped, source: creation }
    color/photo-tint:       { value: "#2a2018", role: "sampled warm-dark tint of the photographic bands (hero/gallery) — the band's fallback underlay while the photo paints; generic photographic-surface tint role", status: mapped, source: screenshot, provenance: [hero, gallery-slider] }
    border/hairline-on-primary: { value: "rgba(50, 39, 26, 0.2)", role: "ALIAS of border/hairline — canonical hairline-on-light role", status: mapped, source: saved-css, provenance: [visit] }
  type:
    # FLAT role shape so each role can declare a loadable renderProxy. Melodrama +
    # Satoshi are the brand's OWN Fontshare faces, downloaded from the source's own
    # @font-face .ttf URLs into assets/fonts/ and SELF-HOSTED via selfHostedFonts.
    # renderProxy declares the measured fallback family class: a high-contrast
    # display serif for Melodrama, a geometric grotesque for Satoshi.
    display-hero:
      { family: "Melodrama", renderProxy: "Playfair Display", sizeRem: { base: 11, tablet: 8.4, mobileL: 5, mobile: 3.28 }, lineHeight: "0.9em", weight: 500, letterSpacing: "0em", case: uppercase,
        tiers: { w1920: { px: 234, source: computed }, w1440: { px: 176, source: computed }, w960: { px: 134, source: computed }, w375: { px: 52, source: computed } },
        note: "hero wordmark measured 175.68px/158.1 @1440 Melodrama w500 uppercase gold; the display fills the band (234px @1920, 52px @375 per the tier ladder)" }
    h1:
      { family: "Melodrama", renderProxy: "Playfair Display", sizeRem: { base: 5, tablet: 5, mobileL: 4, mobile: 2.75 }, lineHeight: "1.2em", weight: 400, letterSpacing: "0.125rem", case: uppercase,
        tiers: { w1920: { px: 80, source: computed }, w1440: { px: 80, source: computed }, w960: { px: 64, source: computed }, w375: { px: 44, source: computed } },
        note: "the section display register: about/visit/newsletter/footer headings measured 80px/96 Melodrama w400 uppercase, 2px tracking (== computed h3); 64px @960, 44px @375" }
    h2:
      { family: "Melodrama", renderProxy: "Playfair Display", sizeRem: { base: 3.5, tablet: 3.5, mobileL: 3, mobile: 2.25 }, lineHeight: "1.2em", weight: 400, letterSpacing: "0.125rem", case: uppercase,
        singleTierConfirmed: true,
        note: "intermediate display register (56px) — derived one rung below h1 for mid-scale headings (founder-story heading vision ~66px sits between h1 80 and this); measured constant across the tier ladder for the 80px register it derives from" }
    h3:
      { family: "Melodrama", renderProxy: "Playfair Display", sizeRem: { base: 2, tablet: 2, mobileL: 1.75, mobile: 1.5 }, lineHeight: "1.25em", weight: 400, letterSpacing: "0.0625rem", case: uppercase,
        singleTierConfirmed: true,
        note: "small Melodrama sub-heading (32px) — the about section's item headlines (PERSPECTIVE HALL / PANORAPEAK VIEWPOINT) ride a compact display register below the 80px band heading" }
    h4:
      { family: "Satoshi", renderProxy: "Manrope", sizeRem: { base: 1.5, tablet: 1.5, mobileL: 1.375, mobile: 1.25 }, lineHeight: "1.3em", weight: 500, letterSpacing: "0em", case: none,
        singleTierConfirmed: true,
        note: "sans statement heading (24px) — card/list headings that speak the working face rather than the display serif" }
    h5:
      { family: "Satoshi", renderProxy: "Manrope", sizeRem: { base: 1.125, tablet: 1.125, mobileL: 1, mobile: 1 }, lineHeight: "1.2em", weight: 500, letterSpacing: "0.0625rem", case: uppercase,
        tiers: { w1920: { px: 18, source: computed }, w1440: { px: 18, source: computed }, w960: { px: 18, source: saved-css }, w375: { px: 14, source: computed } },
        note: "uppercase Satoshi label heading (18px, 1px tracking) — the section eyebrow register measured @1440 (h5); steps to 14px @375" }
    h6:
      { family: "Satoshi", renderProxy: "Manrope", sizeRem: { base: 1, tablet: 1, mobileL: 1, mobile: 1 }, lineHeight: "1.2em", weight: 500, letterSpacing: "0.0625rem", case: uppercase,
        singleTierConfirmed: true,
        note: "smallest uppercase label register (16px) — captions, footer legal caps" }
    eyebrow:
      { family: "Satoshi", renderProxy: "Manrope", sizeRem: { base: 1.125, tablet: 1.125, mobileL: 1, mobile: 0.875 }, lineHeight: "1.2em", weight: 500, letterSpacing: "0.0625rem", case: uppercase,
        tiers: { w1920: { px: 18, source: computed }, w1440: { px: 18, source: computed }, w960: { px: 18, source: saved-css }, w375: { px: 14, source: computed } },
        note: "the uppercase Satoshi eyebrow (ABOUT / VISIT / STAY UPDATED / GALLERY) measured 18px w400-500, 1px tracking (== h5 register)" }
    body:
      { family: "Satoshi", renderProxy: "Manrope", sizeRem: { base: 1.5, tablet: 1.5, mobileL: 1.25, mobile: 1.125 }, lineHeight: "1.4em", weight: 400, case: sentence,
        tiers: { w1920: { px: 24, source: computed }, w1440: { px: 24, source: computed }, w960: { px: 24, source: computed }, w375: { px: 18, source: computed } },
        note: "body measured 24px/33.6 Satoshi w400 — a GENEROUS body is a brand signature (the gallery reads unhurried); 18px @375" }
    body-lg:
      { family: "Satoshi", renderProxy: "Manrope", sizeRem: { base: 1.75, tablet: 1.75, mobileL: 1.5, mobile: 1.25 }, lineHeight: "1.4em", weight: 400, case: sentence,
        singleTierConfirmed: true,
        note: "large body / lede register (28px) — the about section lead paragraph" }
    control-text:
      { family: "Satoshi", renderProxy: "Manrope", sizeRem: { base: 1.125, tablet: 1.125, mobileL: 1.125, mobile: 1 }, lineHeight: "1.2em", weight: 400, letterSpacing: "0.0625rem", case: uppercase,
        tiers: { w1920: { px: 18, source: computed }, w1440: { px: 18, source: computed }, w960: { px: 18, source: computed }, w375: { px: 16, source: saved-css } },
        note: "UI control register — the buy-button + submit + text-arrow CTA labels measured 18px Satoshi, 1px tracking, uppercase" }
    micro:
      { family: "Satoshi", renderProxy: "Manrope", sizeRem: { base: 0.75, tablet: 0.75, mobileL: 0.75, mobile: 0.75 }, lineHeight: "1.2em", weight: 500, letterSpacing: "0.0625rem", case: uppercase,
        singleTierConfirmed: true,
        note: "fine-print / micro-label register (12px) — the smallest tracked caps tier (footer template attribution, utility-scale chrome labels); measured constant across the tier ladder" }
    stat-display:
      { family: "Melodrama", renderProxy: "Playfair Display", sizeRem: { base: 4, tablet: 4, mobileL: 3, mobile: 2.5 }, lineHeight: "1.05em", weight: 400, letterSpacing: "0em", case: uppercase,
        singleTierConfirmed: true, source: derived,
        note: "SYNTHESIZED stat numeral register (64px Melodrama) — derived from the display face for the synthesized stat band (not measured on source: the gallery shows no stat block; provenance: synthesized-from-brand-signals)" }
    # emphasis-inside-heading law: no <strong>/<b> renders inside any h1–h6 at any
    # measured tier (computed tier ladder headingEmphasis: zero hits). Hierarchy is
    # size + family (Melodrama display vs Satoshi labels), never inline bolding.
    headingEmphasis: { notObserved: true, reason: "0 strong/b-in-heading hits at 1920/1440/960/375 (computed tier ladder headingEmphasis empty)", source: computed }
  spacing:
    # The section rhythm is generous (an art gallery breathes). Vision groundings
    # read section pads 40–200px; snapped to the 8px grid into a section ladder.
    section-padding-light: { value: "7.5rem", role: "the workhorse vertical section rhythm (~120px; grounding about/visit/newsletter top pads 90–200, bottom 40–130 — the mid rung)", modeLadder: { base: "7.5rem", tablet: "6rem", mobileL: "4rem", mobile: "3rem" }, status: mapped, source: vision }
    section-y-sm:          { value: "4rem", role: "short section tier (~64px; tighter bands e.g. gallery/footer)", modeLadder: { base: "4rem", tablet: "3rem", mobileL: "2.5rem", mobile: "2rem" }, status: mapped, source: vision }
    section-y-lg:          { value: "9.375rem", role: "spacious tier (~150px; the newsletter band top pad 150 / visit top 200)", modeLadder: { base: "9.375rem", tablet: "7.5rem", mobileL: "5rem", mobile: "4rem" }, status: mapped, source: vision }
    module-gap-editorial:  { value: "7.5rem", role: "ALIAS of section-padding-light — preview/composer module rhythm", status: mapped, source: vision }
    # ── relational ladder (validator C15): named gaps BETWEEN content roles, from the
    # vision groundings' measured relational reads (visit + newsletter each carry
    # eyebrowToHeading + headingToBody), snapped to the 8px grid.
    eyebrow-to-heading:    { value: "2.5rem", role: "eyebrow→heading gap (grounding visit + newsletter relationalSpacingPx eyebrowToHeading 40px)", modeLadder: { base: "2.5rem", tablet: "2rem", mobileL: "1.5rem", mobile: "1rem" }, status: mapped, source: vision }
    heading-to-body:       { value: "5rem", role: "heading→body gap (grounding visit headingToBody 100 / newsletter 80 → canonical 80px)", modeLadder: { base: "5rem", tablet: "3.5rem", mobileL: "2.5rem", mobile: "2rem" }, status: mapped, source: vision }
    body-to-cta:           { value: "2.5rem", role: "body→actions gap (grounding gapPx ~40 between copy and the text-arrow CTA rows)", modeLadder: { base: "2.5rem", tablet: "2rem", mobileL: "1.5rem", mobile: "1.5rem" }, status: mapped, source: vision }
    block-to-block:        { value: "4rem", role: "header-stack→content rhythm inside sections (grounding gapPx 40–64 between the opener and the media/blocks)", modeLadder: { base: "4rem", tablet: "3rem", mobileL: "2.5rem", mobile: "2rem" }, status: mapped, source: vision }
    column-to-column:      { value: "4rem", role: "split-row column gutter (grounding visit gapPx 64 photo↔price card; about gapPx 60)", modeLadder: { base: "4rem", tablet: "3rem", mobileL: "2rem", mobile: "2rem" }, status: mapped, source: vision }
    grid-gap:              { value: "2rem", role: "card/media grid gap (about alternating blocks; synthesized grids)", status: mapped, source: vision }
    panel-padding:         { value: "2.5rem", role: "card/panel inset (grounding visit info card pad 40x40)", status: mapped, source: vision }
    list-item-gap:         { value: "1.125rem", role: "ruled row rhythm (grounding visit price rows pad 18x0 above dividers)", status: mapped, source: vision }
    button-inset:          { value: "0.5625rem 0.9375rem", role: "the filled button inset 9x15 (measured buy-button padding 9px 15px)", status: mapped, source: computed }
    container-max:         { value: "81.25rem", role: "content max-width 1300px measured at every tier (container cssMaxWidth 1300; --container)", status: mapped, source: computed }
    container-span:        { value: "min(100vw - 2.5rem, 81.25rem)", role: "the container LAW as one CSS expression: 1300px cap, ~20px side gutters below the cap (tier facts: used 1300 @1440/1920, full-width minus gutters @960/375)", status: mapped, source: computed }
    radius-global:         { value: "0rem", role: "ALIAS of radius/sharp — the brand's working corner is SHARP (0) — the signature", status: mapped, source: [saved-css, computed] }
  radius:
    # The brand's OWN controls are SHARP (0): buy-button + submit measured
    # border-radius 0. The radiusCensus 50%/3px/100% entries are Webflow LIGHTBOX /
    # slider-dot library chrome, not brand rungs. Media frames carry a hair of
    # rounding (grounding info card/map radiusPx 2-4).
    sharp:  { value: "0rem", var: "the brand control corner (0px)", role: "ALL buttons + the newsletter field + section plates — SHARP corners, the signature", status: mapped, source: [saved-css, computed] }
    small:  { value: "0.25rem", var: "media-frame rounding (grounding info card 2px / map 4px)", role: "media frames (map well, info card) carry a hair of rounding", status: mapped, source: vision }
    circle: { value: "50%", var: "border-radius: 50% (radiusCensus)", role: "webflow slider dots / lightbox controls (library chrome, not a brand device)", status: mapped, source: saved-css }
  shadow:
    # The brand is FLAT — no drop shadows anywhere in the census. Depth comes from
    # surface contrast (espresso vs cream) and overlapping media, not elevation.
    none: { value: "none", role: "no drop shadows — depth is surface contrast + overlapping photo clusters, never elevation", status: mapped, source: [saved-css, vision] }
  motion:
    # Authored from evidence/motion-audit.json (10 transition rules, 1 animation,
    # 1 keyframe). The brand's motion is QUIET: color fades on links + a background
    # fade on the one filled button; no transforms except the webflow slider.
    durations:
      quick:     { value: "100ms", role: "the fastest tier — slider-dot bg/color swap (.w-slider-dot background-color .1s, color .1s)", census: 2, source: motion-audit }
      state:     { value: "200ms", role: "THE control tier — nav/menu link color fades (color .2s), footer bottom-link span (color .2s)", census: 3, source: motion-audit }
      reveal:    { value: "300ms", role: "the DOMINANT tier — buy-button background fade (background-color .3s), footer bottom-link (color .3s), lightbox controls (all .3s)", census: 3, source: motion-audit }
      settle:    { value: "800ms", role: "slow choreography — the footer nav-link color fade (.footer-nav-link transition color .8s) + the lightbox spinner keyframe (.8s linear infinite)", census: 2, source: motion-audit }
    easings:
      - { value: "ease-in-out", use: "the footer social-link color fade (color .25s ease-in-out) — the one measured named curve for hover transitions", census: 1, source: motion-audit }
      - { value: "linear", use: "the lightbox spinner keyframe (.8s linear infinite spin) — library chrome, the only animation on the page", census: 1, source: motion-audit }
    signatureMoves:
      - name: link-color-warm-to-gold
