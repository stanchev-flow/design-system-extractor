layouts:
  - id: navbar
    archetype: nav
    index: 0
    surfaceMode: { mode: "Inverse" }
    useCase: "Chrome on the espresso band: gold wavy-mark + WOODWAVE wordmark left; center slash-separated nav (ABOUT / GALLERY / EXHIBITION / VISIT); a BUY TICKETS text-arrow at the far right. Mobile collapses to a hamburger → full-screen menu with a social grid."
    whenToUse: "Always — global chrome."
    slots:
      - { name: "brand",    type: media,   role: "gold wavy-lines mark + WOODWAVE wordmark", asset: "000-657acd8d782ab334f6b2e5f3-logo.svg" }
      - { name: "navlinks", type: content, role: "slash-separated uppercase nav (18px Satoshi, hover → gold)" }
      - { name: "actions",  type: content, role: "BUY TICKETS text-arrow" }
    gridRules:  { columns: "auto", justify: "space-between", align: center }
    widthRules: { container: "contained", measure: "1300px content max" }
  - id: hero
    archetype: stack
    index: 1
