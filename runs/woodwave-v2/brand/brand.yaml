# ── self-hosted font registry ──────────────────────────────────────────────────────
# The brand's own Fontshare faces (Melodrama display, Satoshi grotesque) were
# downloaded from the source's @font-face .ttf URLs (Webflow CDN) into assets/fonts/.
# The source CSS also carries them (data at those URLs), so the replica renders the
# real faces; the generation path resolves renderProxy (Playfair Display / Manrope)
# when the local faces cannot load.
selfHostedFonts:
  - family: Melodrama
    faces:
      - weight: 400
        files: [Melodrama-400.ttf]
      - weight: 500
        files: [Melodrama-500.ttf]
      - weight: 600
        files: [Melodrama-600.ttf]
  - family: Satoshi
    faces:
      - weight: 400
        files: [Satoshi-400.ttf]
      - weight: 500
        files: [Satoshi-500.ttf]
      - weight: 700
        files: [Satoshi-700.ttf]

