    surface/panel:          { bg: "#fbf4ed", schemeMode: "Container",      intent: "cream card/panel (radius 0 plate, hair of rounding on media frames; FLAT — no shadow); floats on the dark bands (visit info card) and on cream", textPrimary: text/on-primary, textAccent: null, provenance: [visit] }
    surface/raised:         { bg: "#f7efe8", schemeMode: "Secondary",      intent: "raised cream step off the canvas", textPrimary: text/on-primary, textAccent: null, provenance: [about] }
    surface/inverse:        { bg: "#32271a", schemeMode: "Inverse",        intent: "deep espresso dark band (--dark; hero + visit): cream ink, GOLD display accent, cream-bordered filled button; cream cards float on it", textPrimary: text/on-inverse, textAccent: accent/highlight-on-inverse, controls: onInverse, provenance: [hero, visit] }
    surface/inverse-strong: { bg: "#181313", schemeMode: "Inverse",        intent: "near-black footer band (--footer): cream/gold headings, muted-warm-grey links that brighten to gold", textPrimary: text/on-inverse, textAccent: accent/highlight-on-inverse, controls: onInverse, provenance: [footer] }
