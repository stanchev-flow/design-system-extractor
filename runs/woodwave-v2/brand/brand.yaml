    radius: "0rem"
    padding: "0.5625rem 0.9375rem"
    height: "2.625rem"
    font: "Satoshi"
    weight: 400
    sizeRem: 1.125
    letterSpacing: "0.0625rem"
    case: none
    onInverse: { border: "1px solid #fbf4ed", fg: "#fbf4ed", bg: "transparent", bgHover: "#fbf4ed", fgHover: "#32271a", note: "on the espresso/near-black bands the outline is CREAM and hover fills cream with espresso label (the buy-button's own on-dark register)" }
    confidence: medium
    source: derived
    provenance: [hero, visit]
    note: "the on-cream inverse of the filled button (espresso hairline, hover fills espresso) — the brand shows the filled register on dark; this is the sanctioned light-surface sibling."
  textCta:
    style: text-link-arrow
    fg: "#32271a"             # ink on cream (BUY TICKETS / SUBSCRIBE labels)
    fgHover: "#edd580"        # links warm to gold on hover (css hoverRules color: var(--yellow))
    decoration: "uppercase label + trailing arrow glyph; standing links reveal an underline on hover; on dark bands the ink is cream warming to gold"
    radius: "0rem"
