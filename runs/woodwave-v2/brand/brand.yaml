compositionRules:
  - id: dark-first-alternation
    statement: "The page runs DARK-FIRST: it opens on espresso (#32271a), alternates band-by-band with warm cream (#fbf4ed), and closes on the near-black footer (#181313). Dark bands take cream ink + a gold display accent; cream bands take espresso ink."
    value: { dark: "#32271a", cream: "#fbf4ed", footer: "#181313", rhythm: "alternating" }
    confidence: high
    source: [vision, computed]
    scope: design-language
    changelog: []
  - id: melodrama-display-satoshi-body
    statement: "Display voice is Melodrama — a high-contrast didone serif set OVERSIZED and UPPERCASE with letter tracking (the hero wordmark fills the band). Working voice is Satoshi, a grotesque, at a generous 24px body + 18px uppercase labels. Hierarchy is SIZE, never weight jumps or a sans display."
    value: { display: "Melodrama uppercase tracked", body: "Satoshi 24px", eyebrow: "Satoshi 18px uppercase" }
    confidence: high
    source: computed
    scope: design-language
    changelog: []
