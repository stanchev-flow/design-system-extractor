# ── generated-visual devices (code recipes, not files — spec §5) ──────────────────
generatedVisuals:
  - id: page-noise-grain
    kind: noise-grain
    recipe:
      texture: tiling-noise
      opacity: 0.05
      blendMode: multiply
      evidence: >-
        The page carries a fixed full-viewport noise overlay (.fixed-noise-overlay,
        background Noise-bg.gif tiled) that grains the warm surfaces — a subtle matte
        tooth over the espresso/cream bands (css-rules: the noise-bg url + the
        fixed-noise-overlay rule).
    poster: null
    posterNote: "self-rendering: a low-opacity tiling noise texture reproduces the grain from the recipe alone; no captured frame needed (spec §5.1 self-rendering kind)"
    degrade: [live, omit]
    provenance: { source: capture-files, sections: [hero, about, visit], confidence: medium }
