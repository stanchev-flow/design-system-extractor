schemaVersion: media-assets.v1
brand: WoodWave v2
source: >-
  Authored 2026-07-17 (media semantics) from the fresh live capture's curated assets
  (assets-tagged.json, 19 files), evidence/grounding/*.yaml, css-rules.json (the noise
  overlay + tones), and Pillow-measured per-file stats (curate media-assets-draft.yaml).
note: >-
  assets-tagged.json remains the renderer-compat inventory; this artifact is the
  richer semantic superset (stable logical-asset ids, closed kind taxonomy, usage
  rights, measured stats, treatmentDefaults, generated visuals). Every file bound in a
  layout-library pattern slot is registered here (C27). ui-glyphs (arrows) are
  registered though bound via buttons.textCta / accentDevices rather than slot assets.

# ── brand-level imagery grammar (spec §4) — measured via Pillow over the gallery
# photographs (dominant hues 18-31 = warm amber/terracotta band; mid/dark key;
# moderate-to-vivid saturation; matte, no gloss).
photographyFingerprint:
  measured:
    temperatureCast: warm
    keyExposure: mid-key
    saturationBand: moderate
    finish: matte
    sampleSize: 15
    source: measured
  prose: >-
    Warm, atmospheric gallery photography: spiral wooden interiors, sculpture halls,
    latticed archways, terracotta vessels, seated portraits. Warm cast (amber/
    terracotta dominant hues 18-31), mid-key-to-dark exposure, moderate-to-vivid
    saturation, matte finish. Deployed full-bleed (hero, gallery slider), in
    overlapping clusters (hero vessel/figure), and as sharp rectangular editorial
    frames (about, founder). New photography briefs should stay in this family —
    warm interior light, wood and stone materials, unhurried compositions.

