      - computed
      - vision
  type:
    # ── CSS-VARIABLE-FIRST type scale (re-authored 2026-07-21) ──────────────────
    # The scale ground truth is the source's OWN font-size design tokens
    # (--cl-font-size-*), extracted CSS-first by tools/extract/type_scale.py and
    # cross-checked with measured instances + vision. The previous authoring
    # collapsed the ladder (h1=80/h2=18/h3=16) because it sampled the computed
    # font-size of the FIRST heading-tagged element per tag — which happened to be
    # the hero override (h1=80) and a hero CTA control mislabelled h2 (18px), not
    # the real section headings. A single measured instance is never authoritative
    # for a tier; the declared token IS the ladder. See evidence/type-scale.json.
    display-hero:
      family: '"HubSpot Serif Page Header Human", "HubSpot Serif", serif'
      sizeRem:
        base: 5
        mobile: 3
      tiers:
        w1440:
          px: 80
          source: computed
        w375:
          px: 48
          source: computed
      lineHeight: '1.15'
      weight: 500
      letterSpacing: normal
      case: sentence
      provenance:
        source: computed+vision
        role: hero display headline (cl-h1 with a per-instance custom size)
        note: measured 80px @1440 / 48px @375; the semantic h1 token resolves to 48px
        confirmedBy: [computed, vision]
    h1:
      family: '"HubSpot Serif Page Header Human", "HubSpot Serif", serif'
      sizeRem:
        base: 3
        tablet: 3
        mobileL: 2.5
        mobile: 2.5
      tiers:
        w1920:
          px: 48
          source: css-var
        w1440:
          px: 48
          source: css-var
        w960:
          px: 48
          source: css-var
        w375:
          px: 40
          source: css-var
      lineHeight: '1.15'
      weight: 500
      letterSpacing: normal
      case: sentence
      provenance:
        source: css-var
        sourceVariable: --cl-font-size-h1
        selector: h1,.h1,.cl-h1
        responsive: '3rem (48px) @>=900px; 2.5rem (40px) below (--cl-font-size-h1-small)'
        confirmedBy: [computed, vision]
    h2:
      family: '"HubSpot Serif Page Header Human", "HubSpot Serif", serif'
      sizeRem:
        base: 2.5
        tablet: 2.5
        mobileL: 2
        mobile: 2
      tiers:
        w1920:
          px: 40
          source: css-var
        w1440:
          px: 40
          source: css-var
        w960:
          px: 40
          source: css-var
        w375:
          px: 32
          source: css-var
      lineHeight: '1.1'
      weight: 500
      letterSpacing: normal
      case: sentence
      provenance:
        source: css-var
        sourceVariable: --cl-font-size-h2
        selector: h2,.h2,.cl-h2
        responsive: '2.5rem (40px) @>=900px; 2rem (32px) below (--cl-font-size-h2-small)'
        note: 'section headings ride the serif heading family (--cl-font-family-heading); some module H2s swap to HubSpot Sans at the same size'
        confirmedBy: [computed, vision]
    h3:
      family: '"HubSpot Sans", sans-serif'
      sizeRem:
        base: 1.5
      singleTierConfirmed: true
      tiers:
        w1440:
          px: 24
          source: css-var
      lineHeight: '1.42'
      weight: 500
      letterSpacing: normal
      case: sentence
      provenance:
        source: css-var
        sourceVariable: --cl-font-size-h3
        selector: h3,.h3,.cl-h3
        confirmedBy: [computed]
    h4:
      family: '"HubSpot Sans", sans-serif'
      sizeRem:
        base: 1.375
      singleTierConfirmed: true
      tiers:
        w1440:
          px: 22
          source: css-var
      lineHeight: '1.45'
      weight: 500
      letterSpacing: normal
      case: sentence
      provenance:
        source: css-var
        sourceVariable: --cl-font-size-h4
        selector: h4,.h4,.cl-h4
        confirmedBy: [computed]
    h5:
      family: '"HubSpot Sans", sans-serif'
      sizeRem:
        base: 1.125
      singleTierConfirmed: true
      tiers:
        w1440:
          px: 18
          source: css-var
      lineHeight: '1.56'
      weight: 500
      letterSpacing: normal
      case: sentence
      provenance:
        source: css-var
        sourceVariable: --cl-font-size-h5
