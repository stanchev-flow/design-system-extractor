    surface/accent-soft:
      value: '#fcded2'
      role: soft accent canvas
      provenance:
      - section-04
      sourceMeasured: rgb(252, 222, 210)
      sourceVariable: soft-decorative-band-surface
      note: measured section-04 band surface (a soft-accent decorative band); the
        previous authoring drifted to '#f9c9c0'. Confirmed by the css-variable-first
        color-roles.json bandSurfaces channel + the joined-evidence computed ladder.
