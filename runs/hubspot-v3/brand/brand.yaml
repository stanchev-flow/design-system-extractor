  spacing:
    section-padding-light:
      value: 4rem
      role: vertical section padding on light canvas
      modeLadder:
        base: 4rem
        mobile: 3rem
      provenance:
        source: css-var
        sourceVariable: --csol-section-padding-{top,bottom}
        note: aligned to the source's DECLARED section rhythm ladder
          (0/16/24/40/64/96px). The authored 5rem (80px) sat between the declared
          lg (64px = 4rem) and xl (96px) steps — off-scale; snapped to the on-scale
          lg step. Confirmed by spacing-scale.json sectionRhythm + measured section
          band heights.
        confidence: high
    footer-padding:
      value: 3rem
      role: footer band padding (48px 32px)
      modeLadder:
        base: 3rem
        mobile: 2rem
    module-gap:
      value: 2.5rem
      role: gap between header stack and content
    eyebrow-to-heading:
      value: 1.25rem
      modeLadder:
        base: 1.25rem
    heading-to-body:
      value: 2.5rem
      modeLadder:
        base: 2.5rem
    body-to-cta:
      value: 2.5rem
      modeLadder:
        base: 2.5rem
    container-max:
      value: 67.5rem
    container-span:
      value: min(75cqw, 67.5rem)
    block-to-block:
      value: 0.75rem
      role: content-block row rhythm
      provenance:
        source: evidence/css-rules.json
        sourceVariable: --row-gap
        selector: .global-nav-card-group-list
        confidence: high
    column-to-column:
      value: 1.5rem
      role: measured split-column gutter
      provenance:
        source: evidence/css-rules.json
        sourceVariable: --wf-customer-platform-content-column-gap
        selector: .wf-customer-platform__content.-display-carousel,.wf-customer-platform__content.-display-tabs
        confidence: high
    radius-global:
      value: 8px
      role: shared control and component radius
      provenance:
        source: buttons.primary.radius
        confidence: high
    panel-padding:
      value: 1.5rem
      role: measured panel/card inner padding
      provenance:
        source: evidence/css-rules.json
        sourceVariable: card-interactive-padding
        confidence: high
  # ── CSS-VARIABLE-FIRST radius scale (authored 2026-07-21) ─────────────────────
  # The corner ground truth is the source's OWN --*border-radius* design tokens,
  # extracted CSS-first by tools/extract/token_families.py (radius-scale.json) and
  # bound to each control/card/input/pill family by the selectors that consume the
  # token as `border-radius` (strict component-name binding, so a nested
  # card-descendant selector never mis-binds the card radius). radius-global (above)
  # remains the single control radius the composer applies; this block records the
  # full per-family scale as the authored truth the css_fidelity radius audit checks.
  radius:
    control:
      value: 8px
      role: button / control corner
      provenance:
        source: css-var
        sourceVariable: --cl-border-radius-medium
        selector: .cl-button
        confirmedBy:
        - computed
        confidence: high
    input:
      value: 4px
      role: input / field corner
      provenance:
        source: css-var
        sourceVariable: --cl-border-radius-input
        confirmedBy:
        - computed
        confidence: high
    card:
      value: 16px
      role: card / container / panel corner
      provenance:
        source: css-var
        sourceVariable: --cl-border-radius-container
        selector: .cl-card
        confirmedBy:
        - computed
        confidence: high
    # NOTE: the source also declares a fully-rounded pill token
    # (--cl-border-radius-round: 9999px) — captured in evidence/radius-scale.json — but
    # it is not consumed via `border-radius` anywhere in the saved capture, so it is NOT
    # part of the measured radius ladder (C19) and is intentionally not authored here as
    # a px fact. Badge dots use border-radius:50% (a percentage circle, C19-legitimate).
    small:
      value: 4px
      role: small badge / tagline corner
      provenance:
        source: css-var
        sourceVariable: --cl-border-radius-small
        confirmedBy:
        - computed
        confidence: high
    medium:
      value: 8px
      role: medium shared corner
      provenance:
        source: css-var
        sourceVariable: --cl-border-radius-medium
        confirmedBy:
        - computed
        confidence: high
  surfaces:
    surface/primary:
      bg: '#fcfcfa'
      intent: default warm canvas
      textPrimary: text/primary
      textSecondary: null
      textAccent: accent/primary
      provenance:
      - section-02
      - section-03
    surface/white:
      bg: '#ffffff'
      intent: card and header surface
      textPrimary: text/primary
      textSecondary: null
      textAccent: accent/primary
      provenance:
      - section-00
      - section-03
      schemeMode: Container
      border: hairline
      borderProvenance: section-03 measured resting 1px hairline (border/hairline-on-primary
        rgba(0,0,0,0.11)) on the white feature cards — the surfaceGrammar rule 'light canvas
        hosts white cards with 8-12px radius and hairline border'. Keyword resolves to the
        brand's measured hairline; the container plate paints the outline on the warm canvas.
      projectionProvenance: section-03 measured white card surface
    surface/inverse:
      bg: '#1f1f1f'
      intent: dark footer band
      textPrimary: text/on-inverse
      textSecondary: text/on-inverse-muted
      textAccent: accent/primary
      provenance:
      - section-10
    surface/inverse-teal:
      bg: '#002b28'
      intent: dark teal bookend / elevated CTA band
      textPrimary: text/on-inverse
      textSecondary: null
      textAccent: accent/primary
      provenance:
      - section-08
      - section-09
    surface/panel:
      bg: '#fcfcfa'
      intent: default warm canvas
      textPrimary: text/primary
      textSecondary: null
      textAccent: accent/primary
      provenance:
      - section-02
      - section-03
      canonicalAliasOf: surface/primary
      projectionProvenance: existing measured surface role
    surface/inverse-strong:
      bg: '#002b28'
      intent: dark teal bookend / elevated CTA band
      textPrimary: text/on-inverse
      textSecondary: null
      textAccent: accent/primary
      provenance:
      - section-08
      - section-09
      canonicalAliasOf: surface/inverse-teal
      projectionProvenance: existing measured surface role
    surface/accent-soft:
      bg: '#fcded2'
      intent: soft accent canvas
      textPrimary: text/primary
      textSecondary: text/secondary
      textAccent: accent/primary
      provenance:
      - section-04
      sourceMeasured: rgb(252, 222, 210)
      note: soft-accent decorative band surface; resolved from the section-04 measured
        band (color-roles.json bandSurfaces) after the authored token drifted to '#f9c9c0'.
  motion:
    buttonTransition: background-color .15s linear, color .15s linear
    dominantDuration: 300ms
    durations:
      fast: 150ms
      base: 300ms
      slow: 500ms
    easings:
      standard: ease
    carousel:
      duration: 300ms
      easing: ease
    reducedMotion: honored
    character: Restrained, functional micro-motion — fast linear button color washes, 300ms eased carousel
      and dropdown transitions, underline-offset link reveals; no decorative looping animation.
    projectionSource: brand.yaml#motion.value
surfaceGrammar:
  default: surface/primary
  cardOn: surface/white
  bookend: surface/inverse-teal
  footer: surface/inverse
  rules:
  - light canvas hosts white cards with 8-12px radius and hairline border
  - dark teal bands bookend the page (badges, elevated CTA) with cream ink
  - footer is the darkest band (#1f1f1f) with muted white links
  confidence: high
  source: creation
  scope: design-language
