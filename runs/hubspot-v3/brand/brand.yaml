version: '2.0'
brand:
  name: HubSpot
  sourceUrl: https://www.hubspot.com/
  snapshot:
    value: 'HubSpot presents itself as an agentic customer platform that unites marketing, sales, and
      customer service around one Smart CRM, anchored by the hero promise "Where go-to-market teams go
      to grow." The identity pairs a warm cream-and-ink palette with a single high-energy orange accent
      (#ff4800), setting large humanist serif display headlines against a clean HubSpot Sans body voice,
      and it leans on social proof — 299,000+ customers in over 135 countries and #1 rankings across 526
      G2 reports.'
    confidence: high
    source: creation
    scope: design-language
tokens:
