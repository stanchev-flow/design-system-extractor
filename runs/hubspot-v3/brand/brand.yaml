    surface/primary:
      value: '#fcfcfa'
      role: default warm canvas background
      provenance:
      - section-00
      - section-02
      - section-03
    surface/white:
      value: '#ffffff'
      role: card and header surface
      provenance:
      - section-00
      - section-03
    surface/inverse:
      value: '#1f1f1f'
      role: dark footer band
      provenance:
      - section-10
    surface/inverse-teal:
      value: '#002b28'
      role: dark teal bookend / elevated CTA band
      provenance:
      - section-08
      - section-09
    accent/primary:
      value: '#ff4800'
      role: primary action + orange period accent
      provenance:
      - section-00
      - section-03
      - section-09
    accent/primary-hover:
      value: '#c93700'
      role: darker orange hover/pressed accent
      provenance:
      - css-facts.colorCensus
    text/primary:
      value: '#1f1f1f'
      role: body and heading ink on light
      provenance:
