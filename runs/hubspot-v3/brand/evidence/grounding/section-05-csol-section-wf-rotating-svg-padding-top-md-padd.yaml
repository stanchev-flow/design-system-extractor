schemaVersion: section-grounding.v1
sectionRole: cta
layout:
  structure: split ~50/50, copy left / integration logo collage right, inside an inset rounded card
  columns: 2
  alignment: left
  approxPaddingPx:
    top: 90
    bottom: 60
  gapPx: 40
  containerWidth: inset-panel
surfaces:
- role: band
  bgApprox: '#fbfaf7'
  parent: page
  radiusPx: 0
  borderApprox: none
  inkApprox: '#1a1a1a'
- role: chrome-bar
  bgApprox: 'gradient(#f6c6c0 -> #f7cbb0)'
  parent: page
  radiusPx: 0
  borderApprox: none
  inkApprox: '#1a1a1a'
- role: card
  bgApprox: '#ffffff'
  parent: band
  radiusPx: 20
  borderApprox: '1px #ececec'
  inkApprox: '#1a1a1a'
- role: media-well
  bgApprox: '#ffffff'
  parent: card
  radiusPx: 20
  borderApprox: none
  inkApprox: '#1a1a1a'
typography:
- role: h2
  approxSizePx: 27
  weightApprox: 700
  case: sentence
  trackingApprox: normal
  colorApprox: '#1a1a1a'
  familyClass: grotesque-sans
- role: link
  approxSizePx: 15
  weightApprox: 600
  case: sentence
  trackingApprox: normal
  colorApprox: '#1a1a1a'
  familyClass: grotesque-sans
relationalSpacingPx:
  headingToCta: 40
components:
- kind: link
  variant: text-underline
  countObserved: 1
  anatomy: text label with full-width orange underline rule beneath
  sizing:
    widthBehavior: hug
    approxPaddingPx: null
    radiusPx: 0
  surfaceApprox: transparent
  inkApprox: '#1a1a1a'
  caseTreatment: sentence
- kind: logo-item
  variant: color-brand-tiles
  countObserved: 10
  anatomy: scattered colorful third-party app logos and marks
  sizing:
    widthBehavior: hug
    approxPaddingPx: null
    radiusPx: 8
  surfaceApprox: transparent
  inkApprox: '#ffffff'
  caseTreatment: sentence
copy:
  eyebrow: null
  heading: Works with the tools you already use. 2,000+ integrations.
  subheading: null
  body: null
  actions:
  - label: See all app integrations
    styleHint: text-underline
  logosLegible:
  - Slack
  - zapier
  - Shopify
  - mailchimp
  - Google
  - Gmail
media:
- kind: logo-vector
  treatment: scattered color brand logo tiles at varied rotations filling right half
  aspect: landscape
  approxFractionOfSection: 0.5
mediaAssets:
- kind: logo-third-party
  subject: assorted app/service brand marks in a scattered collage
  rightsGuess: third-party-mark
  luminance: light
  busyness: high
  aspect: landscape
  alphaEdge: true
  countObserved: 10
mediaComposition:
- mode: scattered-cluster
  layers: white media-well -> rotated brand logo tiles scattered across it; each logo is a SEPARATE placed
    element
  bakedVsSeparable: logos read as individually placed vectors, not one flat image
  componentsOverMedia: null
chrome:
  casing: sentence
  separators: none
  iconShape: none
  surfaceApprox: 'gradient(#f6c6c0 -> #f7cbb0)'
  linkTreatment: top full-bleed gradient band, no visible links in crop
  ctaTreatment: none in chrome band
motionHints:
- brand logo tiles cropped at frame edges suggest scrolling/animated collage
confidence: high
notes:
- Top pink-peach gradient band is a page-level seam, likely bleed from adjacent section
- Card right edge and logo collage cut off at bottom of crop
_source:
  crop: section-05-csol-section-wf-rotating-svg-padding-top-md-padd.png
  domClasses: csol-section wf-rotating-svg -padding-top-md -padding-bottom-xs
  model: claude-opus-4-8
