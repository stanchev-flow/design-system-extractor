[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshot-to-template"
version = "0.1.0"
description = "Convert website screenshots into text-based design systems"
# 3.12 is a hard floor, not a preference: run_pipeline.py and
# src/screenshot_to_template/models/__init__.py use PEP 701 f-strings (nested
# same-quote quoting), which earlier interpreters cannot even parse.
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.0",
    "openai>=1.0",
    "anthropic>=0.30",
    "google-genai>=1.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    # Headless-browser capture, measurement and replica rendering. Needs a
    # one-time `playwright install chromium` for the browser binaries.
    "playwright>=1.40",
    # Recipe-catalog schema validation (brand_pipeline + tests).
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
screenshot-to-template = "screenshot_to_template.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
